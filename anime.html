    <!-- =========================================================
         FIREBASE + JIKAN
    ========================================================== -->

    <script type="module">

      import { db } from "./firebase-config.js";

      import {
        doc,
        getDoc,
        collection,
        getDocs
      } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

      const JIKAN = "https://api.jikan.moe/v4";


      /* =========================================================
         URL PARAMETER
      ========================================================== */

      const params = new URLSearchParams(
        window.location.search
      );

      const malId = params.get("malId");


      if (!malId) {

        window.location.href = "index.html";

      }


      /* =========================================================
         ELEMENTS
      ========================================================== */

      const heroBg =
        document.getElementById("heroBg");

      const poster =
        document.getElementById("poster");

      const animeTitle =
        document.getElementById("animeTitle");

      const pageTitle =
        document.getElementById("pageTitle");

      const synopsis =
        document.getElementById("synopsis");

      const metaRow =
        document.getElementById("metaRow");

      const genreTags =
        document.getElementById("genreTags");

      const episodeGrid =
        document.getElementById("episodeGrid");

      const epSkeleton =
        document.getElementById("epSkeleton");

      const epEmpty =
        document.getElementById("epEmpty");

      const epError =
        document.getElementById("epError");

      const epErrorMessage =
        document.getElementById("epErrorMessage");

      const epCountBadge =
        document.getElementById("epCountBadge");

      const episodeSubtitle =
        document.getElementById("episodeSubtitle");


      /* =========================================================
         JIKAN FETCH
      ========================================================== */

      async function jikanFetch(
        url,
        retries = 3
      ) {

        for (
          let i = 0;
          i < retries;
          i++
        ) {

          try {

            const response =
              await fetch(url);


            if (
              response.status === 429
            ) {

              await new Promise(
                resolve =>
                  setTimeout(
                    resolve,
                    1200 * (i + 1)
                  )
              );

              continue;

            }


            if (!response.ok) {

              throw new Error(
                `Jikan HTTP ${response.status}`
              );

            }


            return await response.json();

          } catch (error) {

            if (
              i === retries - 1
            ) {

              throw error;

            }


            await new Promise(
              resolve =>
                setTimeout(
                  resolve,
                  700
                )
            );

          }

        }

      }


      /* =========================================================
         LOAD ANIME INFORMATION
      ========================================================== */

      async function loadAnimeInfo() {

        try {

          const result =
          await jikanFetch(
            `${JIKAN}/anime/${malId}`
          );

          const a =
            result.data;


          if (!a) {

            throw new Error(
              "Anime not found"
            );

          }


          const title =
            a.title_english ||
            a.title ||
            `Anime #${malId}`;


          const image =
            a.images?.jpg?.large_image_url ||
            a.images?.jpg?.image_url ||
            "";


          const synopsisText =
            a.synopsis ||
            "No synopsis available.";


          const genres =
            a.genres?.map(
              genre =>
                genre.name
            ) ||
            [];


          const year =
            a.aired?.prop?.from?.year ||
            a.year ||
            "";


          const type =
            a.type ||
            "";


          const status =
            a.status ||
            "";


          const epCount =
            a.episodes ||
            null;


          /* =====================================================
             UPDATE PAGE
          ====================================================== */

          document.title =
            `${title} | Danimeverse`;


          pageTitle.textContent =
            `${title} | Danimeverse`;


          heroBg.src =
            image;


          poster.src =
            image;


          animeTitle.textContent =
            title;


          synopsis.textContent =
            synopsisText;


          metaRow.innerHTML = [

            year
              ? `<span>${year}</span>`
              : "",

            type
              ? `
                <span class="px-2 py-0.5 rounded-full bg-white/10">
                  ${type}
                </span>
              `
              : "",

            status
              ? `
                <span class="px-2 py-0.5 rounded-full bg-white/10">
                  ${status}
                </span>
              `
              : "",

            epCount
              ? `<span>${epCount} episodes</span>`
              : ""

          ].join("");


          genreTags.innerHTML =
            genres
              .slice(0, 6)
              .map(
                genre => `
                  <span
                    class="px-3 py-1 rounded-full text-xs
                    bg-indigo-700/60
                    border border-indigo-500/40
                    text-indigo-200"
                  >
                    ${genre}
                  </span>
                `
              )
              .join("");


        
      /* =========================================================
         LOAD NEW FIRESTORE EPISODES

         Structure:
         animes
            └── MAL ID
                 └── episodes
                      └── episode number
      ========================================================== */

      async function loadNewEpisodes() {

        const episodes = [];


        try {

          const snapshot =
            await getDocs(
              collection(
                db,
                "animes",
                String(malId),
                "episodes"
              )
            );


          snapshot.forEach(
            episodeDoc => {

              const data =
                episodeDoc.data();


              const episodeNumber =
                Number(
                  data.episode
                );


              if (
                !episodeNumber ||
                episodeNumber < 1
              ) {

                return;

              }


              episodes.push({

                episode:
                  episodeNumber,

                title:
                  data.title ||
                  `Episode ${episodeNumber}`,

                febboxUrl:
                  data.febboxUrl ||
                  data.video ||
                  "",

                source:
                  "new"

              });

            }
          );


        } catch (error) {

          console.error(
            "New Firestore episodes error:",
            error
          );

        }


        return episodes;

      }


      /* =========================================================
         LOAD OLD / LEGACY EPISODES

         Old structure:
         videos

         This supports records containing:
         - malId
         - animeMalId
         - animeId
         - animeSlug
         - anime
      ========================================================== */

      async function loadLegacyEpisodes() {

        const episodes = [];


        try {

          const snapshot =
            await getDocs(
              collection(
                db,
                "videos"
              )
            );


          snapshot.forEach(
            episodeDoc => {

              const data =
                episodeDoc.data();


              const recordMalId =
                data.malId ??
                data.animeMalId ??
                data.animeId;


              const matchesMalId =
                recordMalId &&
                String(recordMalId) ===
                String(malId);


              if (
                !matchesMalId
              ) {

                return;

              }


              const episodeNumber =
                Number(
                  data.episode
                );


              if (
                !episodeNumber ||
                episodeNumber < 1
              ) {

                return;

              }


              episodes.push({

                episode:
                  episodeNumber,

                title:
                  data.title ||
                  `Episode ${episodeNumber}`,

                febboxUrl:
                  data.febboxUrl ||
                  data.video ||
                  "",

                source:
                  "legacy"

              });

            }
          );


        } catch (error) {

          console.error(
            "Legacy Firestore episodes error:",
            error
          );

        }


        return episodes;

      }


      /* =========================================================
         COMBINE EPISODES

         New structure takes priority.
         If Episode 1 exists in both old and new,
         the new record wins.
      ========================================================== */

      function combineEpisodes(
        newEpisodes,
        legacyEpisodes
      ) {

        const map =
          new Map();


        /* OLD FIRST */

        legacyEpisodes.forEach(
          episode => {

            map.set(
              episode.episode,
              episode
            );

          }
        );


        /* NEW OVERRIDES OLD */

        newEpisodes.forEach(
          episode => {

            map.set(
              episode.episode,
              episode
            );

          }
        );


        return Array.from(
          map.values()
        ).sort(
          (a, b) =>
            a.episode -
            b.episode
        );

      }


      /* =========================================================
         RENDER EPISODES
      ========================================================== */

      function renderEpisodes(
        episodes
      ) {

        epSkeleton.style.display =
          "none";


        episodeGrid.style.display =
          "grid";


        epEmpty.style.display =
          "none";


        epError.style.display =
          "none";


        if (
          !episodes.length
        ) {

          episodeGrid.style.display =
            "none";


          epEmpty.style.display =
            "block";


          epCountBadge.textContent =
            "No episodes";


          episodeSubtitle.textContent =
            "No episodes have been uploaded yet.";


          return;

        }


        const availableCount =
          episodes.filter(
            episode =>
              !!episode.febboxUrl
          ).length;


        epCountBadge.textContent =
          `${availableCount} available`;


        episodeSubtitle.textContent =
          `${episodes.length} episode${episodes.length !== 1 ? "s" : ""} listed`;


        episodeGrid.innerHTML =
          episodes
            .map(
              episode => {

                const hasVideo =
                  !!episode.febboxUrl;


                const watchUrl =
                  `watch.html?malId=${encodeURIComponent(malId)}&ep=${episode.episode}`;


                return `

                  <div
                    class="glass ep-card rounded-2xl p-5 flex flex-col gap-4"
                  >

                    <!-- TOP -->

                    <div
                      class="flex items-start justify-between gap-3"
                    >

                      <div>

                        <p
                          class="text-xs text-pink-400 font-semibold uppercase tracking-wider mb-1"
                        >
                          Episode ${episode.episode}
                        </p>


                        <h3
                          class="font-semibold text-sm leading-snug text-white"
                        >
                          ${escapeHtml(
                            episode.title ||
                            `Episode ${episode.episode}`
                          )}
                        </h3>

                      </div>


                      ${
                        hasVideo

                          ? `
                            <span class="available-badge">
                              AVAILABLE
                            </span>
                          `

                          : `
                            <span class="unavailable-badge">
                              COMING SOON
                            </span>
                          `
                      }

                    </div>


                    <!-- BOTTOM -->

                    <div
                      class="mt-auto pt-2"
                    >

                      ${
                        hasVideo

                          ? `
                            <a
                              href="${watchUrl}"
                              class="watch-pill"
                            >
                              ▶ Watch Episode
                            </a>
                          `

                          : `
                            <span
                              class="unavailable-pill"
                            >
                              🔒 Not Available Yet
                            </span>
                          `
                      }

                    </div>

                  </div>

                `;

              }
            )
            .join("");

      }


      /* =========================================================
         ESCAPE HTML

         Prevents anime titles / episode titles
         from breaking the page HTML.
      ========================================================== */

      function escapeHtml(
        value
      ) {

        return String(value)
          .replace(
            /&/g,
            "&amp;"
          )
          .replace(
            /</g,
            "&lt;"
          )
          .replace(
            />/g,
            "&gt;"
          )
          .replace(
            /"/g,
            "&quot;"
          )
          .replace(
            /'/g,
            "&#039;"
          );

      }


      /* =========================================================
         LOAD ALL EPISODES
      ========================================================== */

      async function loadEpisodes() {

        epSkeleton.style.display =
          "grid";


        episodeGrid.style.display =
          "none";


        epEmpty.style.display =
          "none";


        epError.style.display =
          "none";


        try {

          /*
            Load both systems at the same time.

            New:
            animes/{malId}/episodes

            Old:
            videos
          */

          const [
            newEpisodes,
            legacyEpisodes
          ] = await Promise.all([

            loadNewEpisodes(),

            loadLegacyEpisodes()

          ]);


          console.log(
            "New episodes:",
            newEpisodes
          );


          console.log(
            "Legacy episodes:",
            legacyEpisodes
          );


          const allEpisodes =
            combineEpisodes(
              newEpisodes,
              legacyEpisodes
            );


          console.log(
            "Combined episodes:",
            allEpisodes
          );


          renderEpisodes(
            allEpisodes
          );


        } catch (error) {

          console.error(
            "Episode loading error:",
            error
          );


          epSkeleton.style.display =
            "none";


          episodeGrid.style.display =
            "none";


          epEmpty.style.display =
            "none";


          epError.style.display =
            "block";


          epErrorMessage.textContent =
            error.message ||
            "Could not load episodes.";

        }

      }


      /* =========================================================
         START
      ========================================================== */

      async function init() {

        /*
          Load anime info and episodes
          simultaneously.
        */

        await Promise.all([

          loadAnimeInfo(),

          loadEpisodes()

        ]);


        console.log(
          "🎬 Danimeverse anime page loaded:",
          malId
        );

      }


      init();

    </script>
