<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <link rel="icon" type="image/png" href="https://i.pinimg.com/736x/fc/8d/c0/fc8dc0a1f0db8842d9c58373acd655a8.jpg">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title id="pageTitle">Loading... | Danimeverse</title>
  <link rel="stylesheet" href="tailwind.min.css">
  <style>
    body { background: #050816; color: white; font-family: 'Segoe UI', system-ui, sans-serif; overflow-x: hidden; }
    .glass { background: rgba(255,255,255,0.05); backdrop-filter: blur(18px); border: 1px solid rgba(255,255,255,0.08); }
    .hero-overlay { background: linear-gradient(to top, rgba(5,8,22,1) 0%, rgba(5,8,22,0.7) 40%, rgba(5,8,22,0.2) 100%); }
    .skeleton {
      background: linear-gradient(90deg, rgba(255,255,255,0.05) 25%, rgba(255,255,255,0.1) 50%, rgba(255,255,255,0.05) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.4s infinite;
      border-radius: .75rem;
    }
    @keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }
    .ep-card { transition: transform .2s, box-shadow .2s; }
    .ep-card:hover { transform: translateY(-4px); }
    .badge { display:inline-block; padding:2px 12px; border-radius:999px; font-size:12px; font-weight:600; }
    .available { background: rgba(236,72,153,.15); border:1px solid rgba(236,72,153,.4); color:#f472b6; }
    .unavailable { background: rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.12); color:#64748b; }
    .watch-pill {
      display:inline-flex; align-items:center; gap:6px;
      background: linear-gradient(135deg,#ec4899,#9333ea);
      color:white; font-size:13px; font-weight:700;
      padding:8px 18px; border-radius:999px; text-decoration:none;
      transition: opacity .2s;
    }
    .watch-pill:hover { opacity: .85; }
  </style>
</head>
<body>

  <!-- HERO -->
  <section class="relative h-[60vh] overflow-hidden">
    <img id="heroBg" src="" alt="" class="absolute inset-0 h-full w-full object-cover"
         onerror="this.style.display='none'"/>
    <div class="hero-overlay absolute inset-0"></div>
    <div class="relative z-10 flex h-full items-end">
      <div class="mx-auto flex w-full max-w-5xl flex-col gap-6 px-5 pb-10 md:flex-row md:items-end">
        <img id="poster" src="" alt=""
             class="w-32 md:w-40 rounded-2xl shadow-2xl border-2 border-white/10"
             onerror="this.style.display='none'" loading="lazy"/>
        <div class="flex-1 min-w-0">
          <p class="mb-2 text-pink-400 font-semibold uppercase tracking-[0.3em] text-sm">Anime Series</p>
          <h1 id="animeTitle" class="text-4xl md:text-5xl font-black leading-tight">
            <span class="skeleton inline-block w-64 h-10">&nbsp;</span>
          </h1>
          <div id="metaRow" class="mt-3 flex flex-wrap gap-2 items-center text-xs text-slate-400"></div>
          <div id="genreTags" class="mt-2 flex flex-wrap gap-2"></div>
        </div>
      </div>
    </div>
  </section>

  <!-- BACK NAV -->
  <div class="mx-auto max-w-5xl px-5 pt-5">
    <a href="index.html" class="text-slate-400 hover:text-pink-400 transition text-sm no-underline">← Back to Home</a>
  </div>

  <!-- SYNOPSIS -->
  <section class="mx-auto max-w-5xl px-5 mt-6">
    <div class="glass rounded-2xl p-5">
      <h2 class="font-bold text-sm uppercase tracking-wider text-slate-400 mb-3">Synopsis</h2>
      <p id="synopsis" class="text-slate-300 text-sm leading-7">
        <span class="skeleton inline-block w-full h-4 mb-2">&nbsp;</span>
        <span class="skeleton inline-block w-5/6 h-4 mb-2">&nbsp;</span>
        <span class="skeleton inline-block w-4/6 h-4">&nbsp;</span>
      </p>
    </div>
  </section>

  <!-- EPISODES -->
  <section class="mx-auto max-w-5xl px-5 mt-8 pb-16">
    <div class="flex items-center justify-between mb-5">
      <h2 class="text-xl font-bold">Episodes</h2>
      <span id="epCountBadge" class="text-xs text-slate-500"></span>
    </div>

    <!-- skeleton grid -->
    <div id="epSkeleton" class="grid gap-4 sm:grid-cols-2 lg:grid-cols-3">
      ${Array(6).fill(`<div class="skeleton h-32 rounded-2xl"></div>`).join("")}
    </div>

    <!-- real episodes -->
    <div id="episodeGrid" class="grid gap-4 sm:grid-cols-2 lg:grid-cols-3" style="display:none"></div>

    <!-- empty / error -->
    <div id="epEmpty" style="display:none" class="glass rounded-2xl p-10 text-center">
      <div style="font-size:48px;margin-bottom:12px">🎬</div>
      <h3 class="font-semibold text-slate-300 mb-2">No Episodes Uploaded Yet</h3>
      <p class="text-sm text-slate-500">Episodes will appear here as they are uploaded.</p>
    </div>
  </section>

<script type="module">
  import { db }  from "./firebase-config.js";
  import {
    doc, getDoc, setDoc, collection, getDocs
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const JIKAN = "https://api.jikan.moe/v4";

  /* ── URL PARAM ── */
  const params = new URLSearchParams(location.search);
  const malId  = params.get("malId");

  if (!malId) { location.href = "index.html"; }

  /* ── FETCH WITH RETRY (handles Jikan rate-limiting) ── */
  async function jikanFetch(url, retries = 3) {
    for (let i = 0; i < retries; i++) {
      try {
        const res = await fetch(url);
        if (res.status === 429) {
          await new Promise(r => setTimeout(r, 1200 * (i + 1)));
          continue;
        }
        if (!res.ok) throw new Error(res.status);
        return await res.json();
      } catch (e) {
        if (i === retries - 1) throw e;
        await new Promise(r => setTimeout(r, 600));
      }
    }
  }

  /* ── LOAD ANIME METADATA ── */
  async function loadAnimeInfo() {
    try {
      const data = await jikanFetch(`${JIKAN}/anime/${malId}`);
      const a    = data.data;

      const title    = a.title_english || a.title;
      const image    = a.images?.jpg?.large_image_url || a.images?.jpg?.image_url || "";
      const synopsis = a.synopsis || "No synopsis available.";
      const genres   = a.genres?.map(g => g.name) || [];
      const year     = a.year || a.aired?.prop?.from?.year || "";
      const type     = a.type || "";
      const status   = a.status || "";
      const epCount  = a.episodes;

      // Update page
      document.title = `${title} | Danimeverse`;
      document.getElementById("pageTitle").textContent = `${title} | Danimeverse`;
      document.getElementById("heroBg").src  = image;
      document.getElementById("poster").src  = image;
      document.getElementById("animeTitle").textContent = title;
      document.getElementById("synopsis").textContent   = synopsis;

      const metaRow = document.getElementById("metaRow");
      metaRow.innerHTML = [
        year  ? `<span>${year}</span>` : "",
        type  ? `<span class="px-2 py-0.5 rounded-full bg-white/10">${type}</span>` : "",
        status? `<span class="px-2 py-0.5 rounded-full bg-white/10">${status}</span>` : "",
        epCount ? `<span>${epCount} eps</span>` : "",
      ].join("");

      document.getElementById("genreTags").innerHTML = genres
        .slice(0, 5)
        .map(g => `<span class="px-3 py-1 rounded-full text-xs bg-indigo-700/60 border border-indigo-500/40 text-indigo-200">${g}</span>`)
        .join("");

      // Cache anime doc in Firestore (background, no await needed)
      setDoc(doc(db, "animes", String(malId)), {
        malId: parseInt(malId),
        title, image, synopsis,
        type, status, year: year || null,
        genres,
        updatedAt: Date.now()
      }, { merge: true }).catch(() => {});

    } catch (err) {
      console.error("Jikan metadata error:", err);
      document.getElementById("animeTitle").textContent = `Anime #${malId}`;
      document.getElementById("synopsis").textContent   = "Could not load anime information.";
    }
  }

  /* ── LOAD UPLOADED EPISODES FROM FIRESTORE ── */
  async function loadEpisodes() {
    document.getElementById("epSkeleton").style.display   = "grid";
    document.getElementById("episodeGrid").style.display  = "none";
    document.getElementById("epEmpty").style.display      = "none";

    try {
      const snap = await getDocs(collection(db, "animes", String(malId), "episodes"));
      const episodes = [];
      snap.forEach(d => episodes.push(d.data()));
      episodes.sort((a, b) => a.episode - b.episode);

      document.getElementById("epSkeleton").style.display = "none";

      if (!episodes.length) {
        document.getElementById("epEmpty").style.display = "block";
        document.getElementById("epCountBadge").textContent = "No episodes uploaded yet";
        return;
      }

      document.getElementById("epCountBadge").textContent =
        `${episodes.length} episode${episodes.length !== 1 ? "s" : ""} available`;

      const grid = document.getElementById("episodeGrid");
      grid.style.display = "grid";

      grid.innerHTML = episodes.map(ep => {
        const hasVideo = !!(ep.febboxUrl || ep.video);
        return `
          <div class="glass ep-card rounded-2xl p-4 flex flex-col gap-3">
            <div>
              <p class="text-xs text-pink-400 font-semibold uppercase tracking-wider mb-1">Episode ${ep.episode}</p>
              <h3 class="font-semibold text-sm leading-snug text-white">
                ${ep.title || "Episode " + ep.episode}
              </h3>
            </div>
            <div class="mt-auto">
              ${hasVideo
                ? `<a href="watch.html?malId=${malId}&ep=${ep.episode}" class="watch-pill">▶ Watch</a>`
                : `<span class="badge unavailable">Coming Soon</span>`
              }
            </div>
          </div>`;
      }).join("");

    } catch (err) {
      console.error("Firestore episodes error:", err);
      document.getElementById("epSkeleton").style.display = "none";
      document.getElementById("epEmpty").style.display    = "block";
    }
  }

  /* ── INIT ── */
  loadAnimeInfo();
  loadEpisodes();
</script>
</body>
</html>
