<script type="module">

import { db } from "./firebase-config.js";

import {
  doc,
  getDoc,
  collection,
  getDocs
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


console.log(
  "🎬 Danimeverse anime page loaded"
);


/* =========================================================
   URL PARAMETERS
========================================================= */

const params =
  new URLSearchParams(
    window.location.search
  );


const anilistId =
  params.get("anilistId");


const malId =
  params.get("malId");


/* =========================================================
   REDIRECT IF NO ID
========================================================= */

if (
  !anilistId &&
  !malId
) {

  window.location.href =
    "index.html";

}


/* =========================================================
   ELEMENTS
========================================================= */

const heroBackground =
  document.getElementById(
    "heroBackground"
  );

const animePoster =
  document.getElementById(
    "animePoster"
  );

const posterSkeleton =
  document.getElementById(
    "posterSkeleton"
  );

const animeTitle =
  document.getElementById(
    "animeTitle"
  );

const metaRow =
  document.getElementById(
    "metaRow"
  );

const genreTags =
  document.getElementById(
    "genreTags"
  );

const synopsis =
  document.getElementById(
    "synopsis"
  );

const episodeGrid =
  document.getElementById(
    "episodeGrid"
  );

const episodeSkeleton =
  document.getElementById(
    "episodeSkeleton"
  );

const episodeEmpty =
  document.getElementById(
    "episodeEmpty"
  );

const episodeError =
  document.getElementById(
    "episodeError"
  );

const episodeErrorMessage =
  document.getElementById(
    "episodeErrorMessage"
  );

const episodeSubtitle =
  document.getElementById(
    "episodeSubtitle"
  );

const episodeCount =
  document.getElementById(
    "episodeCount"
  );


/* =========================================================
   ANILIST QUERY
========================================================= */

const ANILIST_QUERY = `

query ($id: Int, $idMal: Int) {

  Media(
    id: $id
    idMal: $idMal
    type: ANIME
  ) {

    id

    idMal

    title {
      romaji
      english
      native
    }

    coverImage {
      extraLarge
      large
      medium
    }

    bannerImage

    description

    type

    format

    status

    averageScore

    episodes

    seasonYear

    genres

  }

}

`;


/* =========================================================
   LOAD ANILIST
========================================================= */

async function loadAnimeInfo() {

  const variables =
    anilistId

      ? {
          id:
            Number(anilistId)
        }

      : {
          idMal:
            Number(malId)
        };


  const response =
    await fetch(
      "https://graphql.anilist.co",
      {

        method: "POST",

        headers: {

          "Content-Type":
            "application/json",

          "Accept":
            "application/json"

        },

        body:
          JSON.stringify({

            query:
              ANILIST_QUERY,

            variables

          })

      }
    );


  if (
    !response.ok
  ) {

    throw new Error(
      `AniList HTTP ${response.status}`
    );

  }


  const result =
    await response.json();


  if (
    result.errors &&
    result.errors.length
  ) {

    throw new Error(
      result.errors[0].message
    );

  }


  const anime =
    result?.data?.Media;


  if (!anime) {

    throw new Error(
      "Anime not found."
    );

  }


  return anime;

}


/* =========================================================
   RENDER ANIME
========================================================= */

function renderAnime(
  anime
) {

  const title =

    anime.title?.english ||

    anime.title?.romaji ||

    anime.title?.native ||

    "Unknown Anime";


  document.title =
    `${title} | Danimeverse`;


  animeTitle.textContent =
    title;


  /* =====================================================
     POSTER
  ====================================================== */

  const posterUrl =

    anime.coverImage?.extraLarge ||

    anime.coverImage?.large ||

    anime.coverImage?.medium ||

    "";


  if (
    posterUrl
  ) {

    animePoster.src =
      posterUrl;

    animePoster.alt =
      title;

    animePoster.style.display =
      "block";

    posterSkeleton.style.display =
      "none";

  }


  /* =====================================================
     BACKGROUND
  ====================================================== */

  const backgroundUrl =

    anime.bannerImage ||

    posterUrl ||

    "";


  if (
    backgroundUrl
  ) {

    heroBackground.src =
      backgroundUrl;

    heroBackground.onload =
      () => {

        heroBackground.classList.add(
          "loaded"
        );

      };

  }


  /* =====================================================
     META
  ====================================================== */

  const meta = [];


  if (
    anime.seasonYear
  ) {

    meta.push(
      `<span class="meta-item">
        ${anime.seasonYear}
      </span>`
    );

  }


  if (
    anime.type
  ) {

    meta.push(
      `<span class="meta-item">
        ${escapeHtml(anime.type)}
      </span>`
    );

  }


  if (
    anime.format
  ) {

    meta.push(
      `<span class="meta-item">
        ${escapeHtml(
          formatText(anime.format)
        )}
      </span>`
    );

  }


  if (
    anime.status
  ) {

    meta.push(
      `<span class="meta-item">
        ${escapeHtml(
          formatText(anime.status)
        )}
      </span>`
    );

  }


  if (
    anime.averageScore
  ) {

    meta.push(
      `<span class="meta-item">
        ⭐ ${(anime.averageScore / 10).toFixed(1)} / 10
      </span>`
    );

  }


  if (
    anime.episodes
  ) {

    meta.push(
      `<span class="meta-item">
        ${anime.episodes} Episodes
      </span>`
    );

  }


  metaRow.innerHTML =
    meta.join("");


  /* =====================================================
     GENRES
  ====================================================== */

  genreTags.innerHTML =

    anime.genres?.length

      ? anime.genres
          .map(
            genre => `
              <span class="genre-tag">
                ${escapeHtml(genre)}
              </span>
            `
          )
          .join("")

      : "";


  /* =====================================================
     SYNOPSIS
  ====================================================== */

  synopsis.textContent =

    cleanDescription(
      anime.description ||

      "No description available for this anime."
    );

}


/* =========================================================
   FIRESTORE NEW EPISODES
========================================================= */

async function loadNewEpisodes(
  anime
) {

  const episodes = [];


  /*
    Prefer MAL ID because your
    existing Firebase structure uses it.

    Fallback to AniList ID if needed.
  */

  const possibleIds = [];


  if (
    anime.idMal
  ) {

    possibleIds.push(
      String(anime.idMal)
    );

  }


  if (
    anime.id
  ) {

    possibleIds.push(
      String(anime.id)
    );

  }


  const checked =
    new Set();


  for (
    const id
    of possibleIds
  ) {

    if (
      checked.has(id)
    ) {

      continue;

    }


    checked.add(id);


    try {

      const snapshot =
        await getDocs(
          collection(
            db,
            "animes",
            id,
            "episodes"
          )
        );


      if (
        snapshot.empty
      ) {

        continue;

      }


      snapshot.forEach(
        episodeDoc => {

          const data =
            episodeDoc.data();


          let episodeNumber =

            Number(
              data.episode ||

              data.episodeNumber
            );


          /*
            Support:
            ep_1
            episode_1
            1
          */

          if (
            !episodeNumber
          ) {

            const match =

              episodeDoc.id.match(
                /^(?:ep_|episode_)?(\d+)$/
              );


            if (
              match
            ) {

              episodeNumber =
                Number(
                  match[1]
                );

            }

          }


          if (
            !episodeNumber
          ) {

            return;

          }


          episodes.push({

            episode:
              episodeNumber,

            title:
              data.title ||

              `Episode ${episodeNumber}`,

            videoUrl:

              data.playerUrl ||

              data.febboxUrl ||

              data.video ||

              data.videoUrl ||

              "",

            source:
              "new",

            firestoreId:
              id

          });

        }
      );


      /*
        Once we find episodes
        for the primary ID,
        stop checking fallback IDs.
      */

      if (
        episodes.length
      ) {

        break;

      }

    }

    catch (error) {

      console.warn(
        `Could not load episodes for ${id}:`,
        error
      );

    }

  }


  return episodes;

}


/* =========================================================
   LEGACY VIDEOS
========================================================= */

async function loadLegacyEpisodes(
  anime
) {

  const episodes = [];


  try {

    const snapshot =
      await getDocs(
        collection(
          db,
          "videos"
        )
      );


    snapshot.forEach(
      episodeDoc => {

        const data =
          episodeDoc.data();


        const recordMalId =

          data.malId ??

          data.animeMalId ??

          data.animeId;


        if (
          !recordMalId ||
          !anime.idMal ||
          String(recordMalId) !==
          String(anime.idMal)
        ) {

          return;

        }


        const episodeNumber =
          Number(
            data.episode
          );


        if (
          !episodeNumber
        ) {

          return;

        }


        episodes.push({

          episode:
            episodeNumber,

          title:
            data.title ||

            `Episode ${episodeNumber}`,

          videoUrl:

            data.playerUrl ||

            data.febboxUrl ||

            data.video ||

            data.videoUrl ||

            "",

          source:
            "legacy"

        });

      }
    );

  }

  catch (error) {

    console.warn(
      "Legacy episodes failed:",
      error
    );

  }


  return episodes;

}


/* =========================================================
   COMBINE EPISODES
========================================================= */

function combineEpisodes(
  newEpisodes,
  legacyEpisodes
) {

  const map =
    new Map();


  /*
    Legacy first.
  */

  legacyEpisodes.forEach(
    episode => {

      map.set(
        episode.episode,
        episode
      );

    }
  );


  /*
    New Firebase records
    override legacy records.
  */

  newEpisodes.forEach(
    episode => {

      map.set(
        episode.episode,
        episode
      );

    }
  );


  return Array.from(
    map.values()
  ).sort(
    (a,b) =>
      a.episode -
      b.episode
  );

}


/* =========================================================
   RENDER EPISODES
========================================================= */

function renderEpisodes(
  episodes,
  anime
) {

  episodeSkeleton.style.display =
    "none";


  if (
    !episodes.length
  ) {

    episodeGrid.style.display =
      "none";

    episodeEmpty.style.display =
      "block";

    episodeSubtitle.textContent =
      "No episodes have been uploaded yet.";

    episodeCount.textContent =
      "0 Episodes";

    return;

  }


  episodeEmpty.style.display =
    "none";


  episodeGrid.style.display =
    "grid";


  episodeSubtitle.textContent =

    `${episodes.length} episode${
      episodes.length !== 1
        ? "s"
        : ""
    } available`;


  episodeCount.textContent =

    `${episodes.length} Episodes`;


  episodeGrid.innerHTML =

    episodes
      .map(
        episode => {

          const hasVideo =
            !!episode.videoUrl;


          /*
            IMPORTANT:

            Episode goes to WATCH PAGE.

            We pass:
            - AniList ID
            - MAL ID
            - Episode number
          */

          const watchParams =
            new URLSearchParams();


          if (
            anime.id
          ) {

            watchParams.set(
              "anilistId",
              anime.id
            );

          }


          if (
            anime.idMal
          ) {

            watchParams.set(
              "malId",
              anime.idMal
            );

          }


          watchParams.set(
            "ep",
            episode.episode
          );


          const watchUrl =

            `watch.html?${watchParams.toString()}`;


          return `

            <div
              class="episode-card flex flex-col"
            >

              <div
                class="flex items-start justify-between gap-3 mb-5"
              >

                <div>

                  <p
                    class="text-pink-400 text-xs font-bold uppercase tracking-wider mb-2"
                  >
                    Episode ${episode.episode}
                  </p>


                  <h3
                    class="font-semibold text-sm text-white leading-snug"
                  >
                    ${escapeHtml(
                      episode.title
                    )}
                  </h3>

                </div>


                ${
                  hasVideo

                    ? `
                      <span class="available-badge">
                        AVAILABLE
                      </span>
                    `

                    : `
                      <span class="coming-badge">
                        COMING SOON
                      </span>
                    `
                }

              </div>


              <div class="mt-auto">

                ${
                  hasVideo

                    ? `
                      <a
                        href="${watchUrl}"
                        class="watch-button"
                      >
                        ▶ Watch Episode
                      </a>
                    `

                    : `
                      <span
                        class="unavailable-button"
                      >
                        🔒 Not Available Yet
                      </span>
                    `
                }

              </div>

            </div>

          `;

        }
      )
      .join("");

}


/* =========================================================
   HELPERS
========================================================= */

function formatText(
  value
) {

  return String(
    value || ""
  )

    .replace(
      /_/g,
      " "
    )

    .replace(
      /\b\w/g,
      char =>
        char.toUpperCase()
    );

}


function cleanDescription(
  value
) {

  return String(
    value || ""
  )

    .replace(
      /<br\s*\/?>/gi,
      "\n"
    )

    .replace(
      /<[^>]*>/g,
      ""
    );

}


function escapeHtml(
  value
) {

  return String(
    value || ""
  )

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}


/* =========================================================
   INITIALIZE
========================================================= */

async function init() {

  try {

    /*
      Load AniList first.

      We need the anime IDs before
      checking Firebase.
    */

    const anime =
      await loadAnimeInfo();


    console.log(
      "✅ AniList anime:",
      anime
    );


    renderAnime(
      anime
    );


    /*
      Load both Firebase episode
      systems at the same time.
    */

    const [
      newEpisodes,
      legacyEpisodes
    ] = await Promise.all([

      loadNewEpisodes(
        anime
      ),

      loadLegacyEpisodes(
        anime
      )

    ]);


    console.log(
      "🔥 New episodes:",
      newEpisodes
    );


    console.log(
      "📦 Legacy episodes:",
      legacyEpisodes
    );


    const episodes =
      combineEpisodes(
        newEpisodes,
        legacyEpisodes
      );


    console.log(
      "🎬 Combined episodes:",
      episodes
    );


    renderEpisodes(
      episodes,
      anime
    );

  }

  catch (error) {

    console.error(
      "❌ Anime page error:",
      error
    );


    episodeSkeleton.style.display =
      "none";


    episodeError.style.display =
      "block";


    episodeErrorMessage.textContent =

      error.message ||

      "Something went wrong while loading this anime.";

  }

}


init();

</script>

  <script src="footer.js"></script>
