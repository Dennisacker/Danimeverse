<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
     <link rel="icon" type="image/png" href="https://i.pinimg.com/736x/fc/8d/c0/fc8dc0a1f0db8842d9c58373acd655a8.jpg">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Re:Zero | Danimeverse</title>

  <link rel="stylesheet" href="tailwind.min.css">

  <style>
    body {
      font-family: Inter, sans-serif;
      background: #050816;
      color: white;
      overflow-x: hidden;
    }

    .glass {
      background: rgba(255,255,255,0.05);
      backdrop-filter: blur(18px);
      border: 1px solid rgba(255,255,255,0.08);
    }

    .hero-overlay {
      background: linear-gradient(
        to top,
        rgba(5,8,22,1),
        rgba(5,8,22,0.7),
        rgba(5,8,22,0.3)
      );
    }

    .episode-card:hover {
      transform: translateY(-4px);
    }
  </style>
</head>

<body>

  <!-- HERO SECTION -->
  <section class="relative h-[70vh] overflow-hidden">

    <img
      src="https://wallpapercave.com/wp/wp2757874.jpg"
      class="absolute inset-0 h-full w-full object-cover"
    />

    <div class="hero-overlay absolute inset-0"></div>

    <div class="relative z-10 flex h-full items-end">

      <div class="mx-auto flex w-full max-w-7xl flex-col gap-6 px-6 pb-10 md:flex-row md:items-end">

        <!-- POSTER -->
        <img
          src="https://cdn.myanimelist.net/images/anime/1522/128039.jpg"
          class="w-44 rounded-2xl shadow-2xl"
        />

        <!-- INFO -->
        <div class="max-w-3xl">

          <p class="mb-3 text-pink-500 font-semibold uppercase tracking-[0.3em]">
            Anime Series
          </p>

          <h1 class="text-4xl md:text-6xl font-black">
            Re:Zero
          </h1>

          <!-- TAGS -->
          <div class="mt-4 flex flex-wrap gap-2">

            <span class="rounded-full bg-pink-500/20 px-3 py-1 text-sm text-pink-300">
              Fantasy
            </span>

            <span class="rounded-full bg-purple-500/20 px-3 py-1 text-sm text-purple-300">
              Thriller
            </span>

            <span class="rounded-full bg-red-500/20 px-3 py-1 text-sm text-red-300">
              Psychological
            </span>

          </div>

          <!-- DESCRIPTION -->
          <p class="mt-5 max-w-2xl text-slate-300 leading-7">
            Subaru Natsuki continues battling against cruel loops of fate as he faces powerful enemies, painful sacrifices, and the terrifying consequences of every decision he makes.
          </p>

          <!-- BUTTONS -->
          <div class="mt-6 flex flex-wrap gap-4">

            <button class="rounded-full bg-pink-600 px-6 py-3 font-semibold hover:bg-pink-500 transition">
              ▶ Watch Now
            </button>

            <button class="rounded-full border border-white/20 px-6 py-3 hover:bg-white/10 transition">
              + My List
            </button>

          </div>

        </div>

      </div>

    </div>

  </section>

 <!-- EPISODES -->
<section class="mx-auto max-w-7xl px-6 py-16">

  <div class="mb-8 flex items-center justify-between">
    <h2 class="text-3xl font-bold">Episodes</h2>
    <span class="text-slate-400">Season 1-?</span>
  </div>

  <!-- SEASON BUTTONS -->
  <div class="mb-8 flex gap-3 flex-wrap">
    <button onclick="showSeason(1)" class="rounded-full bg-pink-600 px-5 py-2 hover:bg-pink-500 transition">
      Season 1
    </button>

    <button onclick="showSeason(2)" class="rounded-full bg-purple-600 px-5 py-2 hover:bg-purple-500 transition">
      Season 2
    </button>

    <button onclick="showSeason(3)" class="rounded-full bg-indigo-600 px-5 py-2 hover:bg-indigo-500 transition">
      Season 3
    </button>

    <button onclick="showSeason(4)" class="rounded-full bg-slate-600 px-5 py-2 hover:bg-slate-500 transition">
      Season 4
    </button>
  </div>

  <!-- EPISODE LIST (THIS IS THE IMPORTANT PART) -->
  <div id="episodeList" class="grid gap-4 md:grid-cols-2"></div>

</section>
<script>
document.addEventListener("DOMContentLoaded", () => {

  const episodeList = document.getElementById("episodeList");

  const season1 = [];
  const season2 = [];
  const season3 = [];
  const season4 = [];

  /* =========================
     SEASON 1 (25 EPS)
  ========================= */
  for (let i = 1; i <= 25; i++) {
    season1.push({
      ep: i,
      title: `Re:Zero S1 Episode ${i}`,
      desc: `Watch Re:Zero Season 1 Episode ${i}.`,
      image: "https://i.pinimg.com/1200x/8c/bb/26/8cbb26aae043f63eb248caeb67d5b612.jpg",
      video: "https://player.mediadelivery.net/embed/673018/35592cb4-0c78-4267-bab2-45d9723b8955"
    });
  }

  /* =========================
     SEASON 2 (25 EPS + OVAs)
  ========================= */
  for (let i = 1; i <= 25; i++) {
    season2.push({
      ep: i,
      title: `Re:Zero S2 Episode ${i}`,
      desc: `Watch Re:Zero Season 2 Episode ${i}.`,
      image: "https://i.pinimg.com/736x/d8/9b/36/d89b36b73582a9f4cfa2098cbbd80977.jpg",
      video: "https://player.mediadelivery.net/embed/673018/35592cb4-0c78-4267-bab2-45d9723b8955"
    });
  }

  season2.push(
    {
      ep: "OVA 1",
      title: "Memory Snow",
      desc: "Special Episode",
      image: "https://i.pinimg.com/736x/d1/80/cd/d180cd7a4116638a047942b7bb98b745.jpg",
      video: "https://player.mediadelivery.net/embed/673018/35592cb4-0c78-4267-bab2-45d9723b8955"
    },
    {
      ep: "OVA 2",
      title: "Frozen Bonds",
      desc: "Special Episode",
      image: "https://i.pinimg.com/736x/79/5f/22/795f227aafbbc6b32b0ad8620d433368.jpg",
      video: "https://player.mediadelivery.net/embed/673018/35592cb4-0c78-4267-bab2-45d9723b8955"
    }
  );

  /* =========================
     SEASON 3 (16 EPS)
  ========================= */
  for (let i = 1; i <= 16; i++) {
    season3.push({
      ep: i,
      title: `Re:Zero S3 Episode ${i}`,
      desc: `Watch Re:Zero Season 3 Episode ${i}.`,
      image: "https://i.pinimg.com/736x/d1/80/cd/d180cd7a4116638a047942b7bb98b745.jpg",
      video: "https://player.mediadelivery.net/embed/673018/35592cb4-0c78-4267-bab2-45d9723b8955"
    });
  }

  /* =========================
     SEASON 4 (ONGOING - 8 EPS)
  ========================= */
  for (let i = 1; i <= 8; i++) {
    season4.push({
      ep: i,
      title: `Re:Zero S4 Episode ${i}`,
      desc: `Watch Re:Zero Season 4 Episode ${i}.`,
      image: "https://i.pinimg.com/736x/a0/bb/a5/a0bba59e5f3d52bb669bd1f95d946f96.jpg",
      video: "https://player.mediadelivery.net/embed/673018/35592cb4-0c78-4267-bab2-45d9723b8955"
    });
  }

  /* =========================
     RENDER FUNCTION
  ========================= */
  function render(data, isOngoing = false) {
    episodeList.innerHTML = "";

    if (!data.length) {
      episodeList.innerHTML = `
        <p class="text-slate-400 col-span-2 text-center">
          Season is not out yet.
        </p>`;
      return;
    }

    data.forEach(ep => {
      episodeList.innerHTML += `
        <a href="watch.html?anime=ReZero&ep=${ep.ep}&title=${encodeURIComponent(ep.title)}&desc=${encodeURIComponent(ep.desc)}&video=${encodeURIComponent(ep.video)}">

          <div class="episode-card glass flex gap-4 rounded-2xl p-4 hover:bg-white/5 transition">

            <img src="${ep.image}" class="h-24 w-40 rounded-xl object-cover"/>

            <div>
              <p class="text-sm text-pink-400">
                Episode ${ep.ep}
                ${isOngoing ? `<span class="text-green-400 ml-2">(Ongoing)</span>` : ""}
              </p>
              <h3 class="mt-1 text-lg font-semibold">${ep.title}</h3>
              <p class="mt-2 text-sm text-slate-400">${ep.desc}</p>
            </div>

          </div>

        </a>`;
    });
  }

  /* =========================
     SWITCH SEASONS
  ========================= */
  window.showSeason = function(season) {
    if (season === 1) render(season1);
    if (season === 2) render(season2);
    if (season === 3) render(season3);
    if (season === 4) render(season4, true);
  };

  /* AUTO LOAD */
  showSeason(1);

});
</script>
</body>
</html>
