<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
     <link rel="icon" type="image/png" href="https://i.pinimg.com/736x/fc/8d/c0/fc8dc0a1f0db8842d9c58373acd655a8.jpg">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Fate/strange Fake | Danimeverse</title>

  <link rel="stylesheet" href="tailwind.min.css">

  <style>
    body {
      font-family: Inter, sans-serif;
      background: #050816;
      color: white;
      overflow-x: hidden;
    }

    .glass {
      background: rgba(255,255,255,0.05);
      backdrop-filter: blur(18px);
      border: 1px solid rgba(255,255,255,0.08);
    }

    .hero-overlay {
      background: linear-gradient(
        to top,
        rgba(5,8,22,1),
        rgba(5,8,22,0.7),
        rgba(5,8,22,0.3)
      );
    }

    .episode-card:hover {
      transform: translateY(-4px);
    }
  </style>
</head>

<body>

  <!-- HERO SECTION -->
  <section class="relative h-[70vh] overflow-hidden">

    <img
      src="https://wallpapercave.com/wp/wp12609093.jpg"
      class="absolute inset-0 h-full w-full object-cover"
    />

    <div class="hero-overlay absolute inset-0"></div>

    <div class="relative z-10 flex h-full items-end">

      <div class="mx-auto flex w-full max-w-7xl flex-col gap-6 px-6 pb-10 md:flex-row md:items-end">

        <!-- Poster -->
        <img
          src="https://i1-c.pinimg.com/736x/9e/ad/05/9ead05f9a228d1e73cae1f3eddbe0e41.jpg" 
          class="w-44 rounded-2xl shadow-2xl"
        />

        <!-- INFO -->
        <div class="max-w-3xl">

          <p class="mb-3 text-pink-500 font-semibold uppercase tracking-[0.3em]">
            Anime Series
          </p>

          <h1 class="text-4xl md:text-6xl font-black">
            Fate/strange Fake
          </h1>

          <!-- Tags -->
          <div class="mt-4 flex flex-wrap gap-2">

            <span class="rounded-full bg-red-500/20 px-3 py-1 text-sm text-red-300">
              Action
            </span>

            <span class="rounded-full bg-purple-500/20 px-3 py-1 text-sm text-purple-300">
              Fantasy
            </span>

            <span class="rounded-full bg-blue-500/20 px-3 py-1 text-sm text-blue-300">
              Supernatural
            </span>

          </div>

          <!-- Description -->
          <p class="mt-5 max-w-2xl text-slate-300 leading-7">
            In Snowfield, America, a flawed imitation of the Holy Grail War begins. Masters and Servants clash in a chaotic battle filled with false heroes, hidden conspiracies, and unpredictable legends.
          </p>

          <!-- Buttons -->
          <div class="mt-6 flex flex-wrap gap-4">

            <button class="rounded-full bg-pink-600 px-6 py-3 font-semibold hover:bg-pink-500 transition">
              ▶ Watch Now
            </button>

            <button class="rounded-full border border-white/20 px-6 py-3 hover:bg-white/10 transition">
              + My List
            </button>

          </div>

        </div>

      </div>

    </div>

  </section>

  <!-- EPISODES -->
  <section class="mx-auto max-w-7xl px-6 py-16">

    <div class="mb-8 flex items-center justify-between">

      <h2 class="text-3xl font-bold">
        Episodes
      </h2>

      <span class="text-slate-400">
        New Adaptation
      </span>

    </div>

    <div id="episodeList" class="grid gap-4 md:grid-cols-2"></div>
<script>
document.addEventListener("DOMContentLoaded", () => {

  const episodeList = document.getElementById("episodeList");

  const episodes = [];

  // Episode 0 + 13 episodes total (0–12)
  for (let i = 0; i <= 12; i++) {
    episodes.push({
      ep: i,
      title: i === 0 ? "False Grail War (Prologue)" : `Episode ${i}`,
      desc: `Watch Fate/strange Fake Episode ${i}.`,
      image: "https://i.pinimg.com/736x/9e/ad/05/9ead05f9a228d1e73cae1f3eddbe0e41.jpg",
      video: "https://player.mediadelivery.net/embed/673018/35592cb4-0c78-4267-bab2-45d9723b8955"
    });
  }

  function render() {
    episodeList.innerHTML = "";

    episodes.forEach(ep => {
      episodeList.innerHTML += `
        <a href="watch.html?anime=FateStrangeFake&ep=${ep.ep}&title=${encodeURIComponent(ep.title)}&desc=${encodeURIComponent(ep.desc)}&video=${encodeURIComponent(ep.video)}">

          <div class="episode-card glass flex gap-4 rounded-2xl p-4 transition duration-300 hover:bg-white/5">

            <img src="${ep.image}" class="h-24 w-40 rounded-xl object-cover"/>

            <div>
              <p class="text-sm text-pink-400">Episode ${ep.ep}</p>
              <h3 class="mt-1 text-lg font-semibold">${ep.title}</h3>
              <p class="mt-2 text-sm text-slate-400">${ep.desc}</p>
            </div>

          </div>

        </a>
      `;
    });
  }

  render();

});
</script>
</body>
</html>
