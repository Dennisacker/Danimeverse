<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Chainsaw Man | Danimeverse</title>

  <link rel="stylesheet" href="tailwind.min.css">
    <link rel="stylesheet" href="anime-bg.css">

  <style>
    body {
      font-family: Inter, sans-serif;
      background: #050816;
      color: white;
      overflow-x: hidden;
    }

    .glass {
      background: rgba(255,255,255,0.05);
      backdrop-filter: blur(18px);
      border: 1px solid rgba(255,255,255,0.08);
    }

    .hero-overlay {
      background: linear-gradient(
        to top,
        rgba(5,8,22,1),
        rgba(5,8,22,0.7),
        rgba(5,8,22,0.3)
      );
    }

    .episode-card:hover {
      transform: translateY(-4px);
    }
  </style>
</head>

<body>

  <!-- HERO -->
  <section class="relative h-[70vh] overflow-hidden">

    <img
      src="https://wallpapercave.com/wp/wp10217331.jpg"
      class="absolute inset-0 h-full w-full object-cover"
    />

    <div class="hero-overlay absolute inset-0"></div>

    <div class="relative z-10 flex h-full items-end">

      <div class="mx-auto flex w-full max-w-7xl flex-col gap-6 px-6 pb-10 md:flex-row md:items-end">

        <!-- Poster -->
        <img
          src="https://cdn.myanimelist.net/images/anime/1806/126216.jpg"
          class="w-44 rounded-2xl shadow-2xl"
        />

        <!-- INFO -->
        <div class="max-w-3xl">

          <p class="mb-3 text-pink-500 font-semibold uppercase tracking-[0.3em]">
            Anime Series
          </p>

          <h1 class="text-4xl md:text-6xl font-black">
            Chainsaw Man
          </h1>

          <!-- Tags -->
          <div class="mt-4 flex flex-wrap gap-2">

            <span class="rounded-full bg-red-500/20 px-3 py-1 text-sm text-red-300">
              Horror
            </span>

            <span class="rounded-full bg-pink-500/20 px-3 py-1 text-sm text-pink-300">
              Dark Fantasy
            </span>

            <span class="rounded-full bg-orange-500/20 px-3 py-1 text-sm text-orange-300">
              Action
            </span>

          </div>

          <!-- Description -->
          <p class="mt-5 max-w-2xl text-slate-300 leading-7">
            After merging with his chainsaw devil companion Pochita, Denji becomes Chainsaw Man — a devil hunter caught in brutal battles, twisted conspiracies, and the struggle to live a normal life.
          </p>

          <!-- Buttons -->
          <div class="mt-6 flex flex-wrap gap-4">

            <button class="rounded-full bg-pink-600 px-6 py-3 font-semibold hover:bg-pink-500 transition">
              ▶ Watch Now
            </button>

            <button class="rounded-full border border-white/20 px-6 py-3 hover:bg-white/10 transition">
              + My List
            </button>

          </div>

        </div>

      </div>

    </div>

  </section>

 <!-- EPISODES -->
<section class="mx-auto max-w-7xl px-6 py-16">

  <div class="mb-8 flex items-center justify-between">
    <h2 class="text-3xl font-bold">Episodes</h2>
    <span class="text-slate-400">Chainsaw Man</span>
  </div>

  <!-- BUTTONS -->
  <div class="mb-8 flex gap-3 flex-wrap">

    <button onclick="showSeason('s1')" class="rounded-full bg-pink-600 px-5 py-2 hover:bg-pink-500 transition">
      Season 1
    </button>

    <button onclick="showSeason('movie')" class="rounded-full bg-orange-600 px-5 py-2 hover:bg-orange-500 transition">
      Reze Arc (Movie)
    </button>

  </div>

  <!-- EPISODE LIST -->
  <div id="episodeList" class="grid gap-4 md:grid-cols-2"></div>

</section>
<script>
document.addEventListener("DOMContentLoaded", () => {

  const episodeList = document.getElementById("episodeList");

  const season1 = [];

  // Season 1 - 12 episodes
  for (let i = 1; i <= 12; i++) {
    season1.push({
      ep: i,
      title: `Chainsaw Man Episode ${i}`,
      desc: `Watch Chainsaw Man Episode ${i}.`,
      image: "https://i.pinimg.com/736x/93/94/c0/9394c0075ac3fbef70cfdd0bbbadfd11.jpg",
      video: "https://streamtape.com/e/GAgGMmwRlXi1k3D/"
    });
  }

  // Reze Arc Movie
  const movie = [{
    ep: "Movie",
    title: "Chainsaw Man: Reze Arc",
    desc: "Denji meets Reze in a dangerous love story that changes everything.",
    image: "https://i.pinimg.com/736x/4b/67/21/4b672145fd8ecb4b71c4d959d19502ff.jpg",
    video: "https://streamtape.com/e/GAgGMmwRlXi1k3D/"
  }];

  function render(data) {
    episodeList.innerHTML = "";

    data.forEach(ep => {
      episodeList.innerHTML += `
        <a href="watch.html?anime=ChainsawMan&ep=${ep.ep}&title=${encodeURIComponent(ep.title)}&desc=${encodeURIComponent(ep.desc)}&video=${encodeURIComponent(ep.video)}">

          <div class="episode-card glass flex gap-4 rounded-2xl p-4 transition duration-300 hover:bg-white/5">

            <img src="${ep.image}" class="h-24 w-40 rounded-xl object-cover"/>

            <div>
              <p class="text-sm text-pink-400">Episode ${ep.ep}</p>
              <h3 class="mt-1 text-lg font-semibold">${ep.title}</h3>
              <p class="mt-2 text-sm text-slate-400">${ep.desc}</p>
            </div>

          </div>

        </a>
      `;
    });
  }

  window.showSeason = function(type) {
    if (type === "s1") render(season1);
    if (type === "movie") render(movie);
  };

  // auto load season 1
  showSeason("movie");

});
</script>
</body>
</html>
