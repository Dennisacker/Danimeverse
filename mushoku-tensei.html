<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
     <link rel="icon" type="image/png" href="https://i.pinimg.com/736x/fc/8d/c0/fc8dc0a1f0db8842d9c58373acd655a8.jpg">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Mushoku Tensei | Danimeverse</title>

  <link rel="stylesheet" href="tailwind.min.css">

  <style>
    body {
      font-family: Inter, sans-serif;
      background: #050816;
      color: white;
      overflow-x: hidden;
    }

    .glass {
      background: rgba(255,255,255,0.05);
      backdrop-filter: blur(18px);
      border: 1px solid rgba(255,255,255,0.08);
    }

    .hero-overlay {
      background: linear-gradient(
        to top,
        rgba(5,8,22,1),
        rgba(5,8,22,0.7),
        rgba(5,8,22,0.3)
      );
    }

    .episode-card:hover {
      transform: translateY(-4px);
    }
  </style>
</head>

<body>

  <!-- HERO SECTION -->
  <section class="relative h-[70vh] overflow-hidden">

    <img
      src="https://wallpapercave.com/wp/wp9380428.jpg"
      class="absolute inset-0 h-full w-full object-cover"
    />

    <div class="hero-overlay absolute inset-0"></div>

    <div class="relative z-10 flex h-full items-end">

      <div class="mx-auto flex w-full max-w-7xl flex-col gap-6 px-6 pb-10 md:flex-row md:items-end">

        <!-- POSTER -->
        <img
          src="https://cdn.myanimelist.net/images/anime/1530/117776.jpg"
          class="w-44 rounded-2xl shadow-2xl"
        />

        <!-- INFO -->
        <div class="max-w-3xl">

          <p class="mb-3 text-pink-500 font-semibold uppercase tracking-[0.3em]">
            Anime Series
          </p>

          <h1 class="text-4xl md:text-6xl font-black">
            Mushoku Tensei
          </h1>

          <!-- TAGS -->
          <div class="mt-4 flex flex-wrap gap-2">

            <span class="rounded-full bg-pink-500/20 px-3 py-1 text-sm text-pink-300">
              Fantasy
            </span>

            <span class="rounded-full bg-purple-500/20 px-3 py-1 text-sm text-purple-300">
              Isekai
            </span>

            <span class="rounded-full bg-cyan-500/20 px-3 py-1 text-sm text-cyan-300">
              Adventure
            </span>

          </div>

          <!-- DESCRIPTION -->
          <p class="mt-5 max-w-2xl text-slate-300 leading-7">
            After being reincarnated into a magical world, Rudeus Greyrat sets out to live a meaningful life while mastering powerful magic, facing emotional struggles, and discovering his true purpose.
          </p>

          <!-- BUTTONS -->
          <div class="mt-6 flex flex-wrap gap-4">

            <button class="rounded-full bg-pink-600 px-6 py-3 font-semibold hover:bg-pink-500 transition">
              ▶ Watch Now
            </button>

            <button class="rounded-full border border-white/20 px-6 py-3 hover:bg-white/10 transition">
              + My List
            </button>

          </div>

        </div>

      </div>

    </div>

  </section>

 <section class="mx-auto max-w-7xl px-6 py-16">

  <div class="mb-8 flex items-center justify-between">
    <h2 class="text-3xl font-bold">Episodes</h2>
    <span class="text-slate-400">Seasons 1-?</span>
  </div>

  <!-- SEASON BUTTONS -->
  <div class="mb-8 flex gap-3 flex-wrap">

    <button onclick="showSeason(1)"
      class="rounded-full bg-pink-600 px-5 py-2 hover:bg-pink-500 transition">
      Season 1
    </button>

    <button onclick="showSeason(2)"
      class="rounded-full bg-purple-600 px-5 py-2 hover:bg-purple-500 transition">
      Season 2
    </button>

    <button onclick="showSeason(3)"
      class="rounded-full bg-gray-600 px-5 py-2 hover:bg-gray-500 transition">
      Season 3 (Soon)
    </button>

  </div>

  <!-- EPISODES -->
  <div id="episodeList" class="grid gap-4 md:grid-cols-2"></div>

</section>
<script>

document.addEventListener("DOMContentLoaded", () => {

  const episodeList = document.getElementById("episodeList");

  const season1 = [];
  const season2 = [];
  const season3 = []; // empty (not out)

  // =====================
  // SEASON 1 (23 EPS + OVA)
  // =====================
  for (let i = 1; i <= 23; i++) {
    season1.push({
      ep: i,
      title: `Mushoku Tensei S1 Episode ${i}`,
      desc: `Watch Mushoku Tensei Season 1 Episode ${i}.`,
      image: "https://cdn.myanimelist.net/images/anime/1530/117776.jpg",
      video: "https://player.mediadelivery.net/embed/673018/35592cb4-0c78-4267-bab2-45d9723b8955"
    });
  }

  // OVA episode
  season1.push({
    ep: "OVA",
    title: "Mushoku Tensei OVA",
    desc: "Special episode of Mushoku Tensei Season 1.",
    image: "https://i.pinimg.com/736x/49/80/1d/49801d32a470ab5ca311ede7d3a22775.jpg",
    video: "https://player.mediadelivery.net/embed/673018/35592cb4-0c78-4267-bab2-45d9723b8955"
  });

  // =====================
  // SEASON 2 (25 EPS)
  // =====================
  for (let i = 1; i <= 25; i++) {
    season2.push({
      ep: i,
      title: `Mushoku Tensei S2 Episode ${i}`,
      desc: `Watch Mushoku Tensei Season 2 Episode ${i}.`,
      image: "https://i.pinimg.com/736x/d1/5a/c5/d15ac5923165a7deb0eeadee9b202950.jpg",
      video: "https://player.mediadelivery.net/embed/673018/35592cb4-0c78-4267-bab2-45d9723b8955"
    });
  }

  // =====================
  // RENDER FUNCTION
  // =====================
  window.showSeason = function(season) {

    episodeList.innerHTML = "";

    let data = [];

    if (season === 1) data = season1;
    if (season === 2) data = season2;
    if (season === 3) data = season3; // empty

    if (data.length === 0) {
      episodeList.innerHTML = `
        <p class="text-slate-400">Season 3 is not out yet.</p>
      `;
      return;
    }

    data.forEach(ep => {

      episodeList.innerHTML += `
        <a href="watch.html?anime=Mushoku%20Tensei&ep=${ep.ep}&title=${encodeURIComponent(ep.title)}&desc=${encodeURIComponent(ep.desc)}&video=${encodeURIComponent(ep.video)}">

          <div class="episode-card glass flex gap-4 rounded-2xl p-4 transition duration-300 hover:bg-white/5">

            <img src="${ep.image}" class="h-24 w-40 rounded-xl object-cover"/>

            <div>
              <p class="text-sm text-pink-400">Episode ${ep.ep}</p>
              <h3 class="mt-1 text-lg font-semibold">${ep.title}</h3>
              <p class="mt-2 text-sm text-slate-400">${ep.desc}</p>
            </div>

          </div>

        </a>
      `;

    });

  };

  // default load
  showSeason(1);

});

</script>
</body>
</html>
