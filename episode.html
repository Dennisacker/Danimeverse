<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="https://i.pinimg.com/736x/fc/8d/c0/fc8dc0a1f0db8842d9c58373acd655a8.jpg">
  <title>Watch Episode</title>
  <link rel="stylesheet" href="tailwind.min.css">
</head>

<body class="bg-black text-white p-6">

  <!-- VIDEO -->
  <div class="bg-gray-900 rounded-2xl overflow-hidden">
    <div class="h-[300px] md:h-[500px] flex items-center justify-center bg-black">
      <p class="text-gray-400">Video Player Here</p>
    </div>
  </div>

  <!-- INFO -->
  <div class="mt-6">
    <h1 id="title" class="text-2xl font-bold"></h1>
    <p id="desc" class="text-gray-400 mt-2"></p>
  </div>

  <!-- NAV -->
  <div class="mt-6 flex gap-4">
    <button class="px-4 py-2 bg-gray-800 rounded-xl">⬅ Previous</button>
    <button class="px-4 py-2 bg-pink-600 rounded-xl">Next ➡</button>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const anime = params.get("anime");
    const ep = params.get("ep");

    document.getElementById("title").textContent =
      anime + " - Episode " + ep;

    document.getElementById("desc").textContent =
      "Now playing selected episode...";
  </script>

</body>
</html>
