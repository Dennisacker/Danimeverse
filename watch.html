<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="https://i.pinimg.com/736x/fc/8d/c0/fc8dc0a1f0db8842d9c58373acd655a8.jpg">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Watch Episode</title>

  <link rel="stylesheet" href="tailwind.min.css">

  <style>
    body {
      background: #050816;
      color: white;
      font-family: Arial, sans-serif;
    }

    .glass {
      background: rgba(255,255,255,0.05);
      backdrop-filter: blur(15px);
      border: 1px solid rgba(255,255,255,0.08);
    }
  </style>
</head>

<body>

<div class="w-full max-w-4xl mx-auto px-4 py-6">

  <!-- VIDEO -->
  <div class="glass rounded-2xl overflow-hidden relative pt-[56.25%]">
    <iframe id="videoPlayer"
      class="absolute top-0 left-0 w-full h-full"
      src=""
      allow="autoplay; fullscreen"
      allowfullscreen>
    </iframe>
  </div>

  <!-- INFO -->
  <div class="mt-5 glass rounded-2xl p-4 space-y-2">
    <p id="animeName" class="text-pink-400 font-bold uppercase"></p>
    <h1 id="episodeTitle" class="text-2xl font-black"></h1>
    <p id="episodeDesc" class="text-gray-300"></p>
  </div>

  <!-- BUTTONS -->
  <div class="mt-4 flex gap-2">
    <button id="prevBtn" class="flex-1 border border-purple-500 text-purple-400 py-2 rounded-full">◀ Prev</button>
    <button id="nextBtn" class="flex-1 bg-pink-600 py-2 rounded-full">Next ▶</button>
  </div>

  <!-- EPISODES LIST -->
  <div id="episodeList" class="mt-6"></div>

</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "YOUR_KEY",
    authDomain: "YOUR_DOMAIN",
    projectId: "YOUR_PROJECT_ID",
    storageBucket: "YOUR_BUCKET",
    messagingSenderId: "YOUR_ID",
    appId: "YOUR_APP_ID"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  const params = new URLSearchParams(location.search);

  const anime = params.get("anime");
  let ep = parseInt(params.get("ep")) || 1;

  const animeName = document.getElementById("animeName");
  const episodeTitle = document.getElementById("episodeTitle");
  const episodeDesc = document.getElementById("episodeDesc");
  const playerWrap = document.getElementById("playerWrap");

  animeName.textContent = anime;
  episodeTitle.textContent = `Episode ${ep}`;

  async function load() {
    const id = `${anime}_${ep}`;

    const snap = await getDoc(doc(db, "videos", id));

    if (!snap.exists()) {
      playerWrap.innerHTML = "<p>Episode not uploaded yet</p>";
      return;
    }

    const data = snap.data();

    episodeTitle.textContent = data.title;

    playerWrap.innerHTML = `
      <iframe
        src="${data.video}"
        style="position:absolute;top:0;left:0;width:100%;height:100%;border:0"
        allowfullscreen>
      </iframe>
    `;
  }

  load();

  /* NEXT */
  document.getElementById("nextBtn").onclick = () => {
    ep++;
    location.href = `watch.html?anime=${anime}&ep=${ep}`;
  };

  /* PREV */
  document.getElementById("prevBtn").onclick = () => {
    if (ep <= 1) return;
    ep--;
    location.href = `watch.html?anime=${anime}&ep=${ep}`;
  };
</script>

</body>
</html>
