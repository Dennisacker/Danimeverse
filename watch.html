<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="https://i.pinimg.com/736x/fc/8d/c0/fc8dc0a1f0db8842d9c58373acd655a8.jpg">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Watch Episode — Danimeverse</title>
  <link rel="stylesheet" href="tailwind.min.css">

  <style>
    body {
      background: #050816;
      color: white;
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
    }
    .glass {
      background: rgba(255,255,255,0.05);
      backdrop-filter: blur(15px);
      border: 1px solid rgba(255,255,255,0.08);
    }
    .watch-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      background: linear-gradient(135deg, #ec4899, #9333ea);
      color: white;
      font-size: 20px;
      font-weight: 800;
      padding: 20px 40px;
      border-radius: 16px;
      border: none;
      cursor: pointer;
      letter-spacing: .04em;
      transition: opacity .2s, transform .15s;
      text-decoration: none;
    }
    .watch-btn:hover { opacity: .88; transform: translateY(-2px); }
    .nav-btn {
      flex: 1;
      padding: 12px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.15);
      background: rgba(255,255,255,0.05);
      color: white;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all .2s;
    }
    .nav-btn:hover:not([disabled]) { border-color: #ec4899; background: rgba(236,72,153,.15); }
    .nav-btn[disabled] { opacity: .3; cursor: not-allowed; }
    .ep-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.06);
      text-decoration: none;
      color: white;
      transition: all .2s;
    }
    .ep-row:hover { background: rgba(255,255,255,0.06); border-color: rgba(236,72,153,.4); }
    .ep-row.current { background: rgba(236,72,153,.12); border-color: rgba(236,72,153,.5); }
    .pulse-skeleton {
      background: linear-gradient(90deg, rgba(255,255,255,0.05) 25%, rgba(255,255,255,0.1) 50%, rgba(255,255,255,0.05) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.4s infinite;
      border-radius: 12px;
    }
    @keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }
  </style>
</head>
<body>

<div class="w-full max-w-2xl mx-auto px-4 py-6">

  <!-- BACK LINK -->
  <a id="backLink" href="index.html"
     class="inline-flex items-center gap-2 text-slate-400 text-sm mb-5 hover:text-pink-400 transition no-underline">
    ← Back
  </a>

  <!-- INFO CARD -->
  <div class="glass rounded-2xl p-6 mb-5">
    <!-- skeleton while loading -->
    <div id="skeleton">
      <div class="pulse-skeleton h-4 w-1/3 mb-3"></div>
      <div class="pulse-skeleton h-8 w-2/3 mb-2"></div>
      <div class="pulse-skeleton h-5 w-1/2 mb-6"></div>
      <div class="pulse-skeleton h-16 w-full"></div>
    </div>

    <!-- real content -->
    <div id="infoContent" style="display:none">
      <p id="animeName" class="text-pink-400 font-bold uppercase text-sm tracking-wider mb-1"></p>
      <h1 id="episodeNum" class="text-3xl font-black mb-1"></h1>
      <h2 id="episodeTitle" class="text-base font-semibold text-white/70 mb-5"></h2>
      <div id="watchArea"></div>
    </div>

    <!-- error state -->
    <div id="errorState" style="display:none" class="text-center py-6">
      <div style="font-size:48px;margin-bottom:12px">🎬</div>
      <h3 id="errorTitle" class="text-lg font-semibold text-slate-300 mb-2">Episode Not Available</h3>
      <p id="errorMsg" class="text-sm text-slate-500">This episode hasn't been uploaded yet.</p>
    </div>
  </div>

  <!-- NAVIGATION -->
  <div class="flex gap-3 mb-6">
    <button id="prevBtn" class="nav-btn" disabled>◀ Previous Episode</button>
    <button id="nextBtn" class="nav-btn" disabled>Next Episode ▶</button>
  </div>

  <!-- EPISODE LIST -->
  <div id="epListWrap" style="display:none" class="glass rounded-2xl p-4">
    <h3 class="text-sm font-bold text-white/40 uppercase tracking-wider mb-3">Episodes</h3>
    <div id="epList" class="flex flex-col gap-2 max-h-80 overflow-y-auto"></div>
  </div>

</div>

  <script type="module">
    import { db } from "./firebase-config.js";

    import {
      doc,
      getDoc,
      collection,
      getDocs
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


    /* =========================================================
       URL PARAMETERS

       Supports:
       watch.html?anime=Naruto&ep=1

       Also supports:
       watch.html?malId=5114&ep=1
    ========================================================== */

    const params = new URLSearchParams(window.location.search);

    const animeParam = params.get("anime");
    const malId = params.get("malId");
    const ep = parseInt(params.get("ep")) || 1;


    /* =========================================================
       ELEMENTS
    ========================================================== */

    const skeleton =
      document.getElementById("skeleton");

    const infoContent =
      document.getElementById("infoContent");

    const errorState =
      document.getElementById("errorState");

    const animeName =
      document.getElementById("animeName");

    const episodeNum =
      document.getElementById("episodeNum");

    const episodeTitle =
      document.getElementById("episodeTitle");

    const watchArea =
      document.getElementById("watchArea");

    const prevBtn =
      document.getElementById("prevBtn");

    const nextBtn =
      document.getElementById("nextBtn");

    const epListWrap =
      document.getElementById("epListWrap");

    const epList =
      document.getElementById("epList");

    const backLink =
      document.getElementById("backLink");


    /* =========================================================
       CHECK URL
    ========================================================== */

    if (!animeParam && !malId) {
      window.location.href = "index.html";
    }


    /* =========================================================
       WATCH EPISODE FROM OLD FIRESTORE STRUCTURE

       Your Firestore:

       animes
         └── Naruto
              ├── title: "naruto"
              ├── image: "..."
              └── episodes
                   └── ep_1
                        ├── episode: "1"
                        └── video: "..."
    ========================================================== */

    async function loadAnime() {

      try {

        /*
          If URL is:

          watch.html?anime=Naruto&ep=1

          we use "Naruto" as the document ID.
        */

        const animeId =
          animeParam || malId;


        /* =====================================================
           LOAD ANIME DOCUMENT
        ====================================================== */

        const animeRef =
          doc(
            db,
            "animes",
            String(animeId)
          );

        const animeSnap =
          await getDoc(animeRef);


        let animeData = {};

        if (animeSnap.exists()) {

          animeData =
            animeSnap.data();

        }


        /* =====================================================
           LOAD EPISODE

           Your episode document is:

           ep_1
           ep_2
           ep_3

           NOT:

           1
           2
           3
        ====================================================== */

        const episodeId =
          `ep_${ep}`;


        const episodeRef =
          doc(
            db,
            "animes",
            String(animeId),
            "episodes",
            episodeId
          );


        const episodeSnap =
          await getDoc(episodeRef);


        /* =====================================================
           STOP SKELETON
        ====================================================== */

        skeleton.style.display =
          "none";

        infoContent.style.display =
          "block";


        /* =====================================================
           ANIME NAME
        ====================================================== */

        animeName.textContent =
          animeData.title ||
          animeId ||
          `Anime`;


        /* =====================================================
           EPISODE NUMBER
        ====================================================== */

        episodeNum.textContent =
          `Episode ${ep}`;


        /* =====================================================
           CHECK EPISODE
        ====================================================== */

        if (!episodeSnap.exists()) {

          episodeTitle.textContent =
            `Episode ${ep}`;

          showError(
            "Episode Not Uploaded Yet",
            "This episode hasn't been uploaded yet. Check back later."
          );

        } else {

          const data =
            episodeSnap.data();


          /* ===================================================
             EPISODE TITLE
          ==================================================== */

          episodeTitle.textContent =
            data.title ||
            `Episode ${ep}`;


          /* ===================================================
             VIDEO URL

             Your Firestore currently uses:

             video

             But the new system uses:

             febboxUrl

             So we support BOTH.
          ==================================================== */

          const videoUrl =
            data.febboxUrl ||
            data.video ||
            "";


          renderWatchButton(
            videoUrl
          );

        }


        /* =====================================================
           BACK BUTTON
        ====================================================== */

        if (animeParam) {

          backLink.href =
            `anime.html?anime=${encodeURIComponent(animeParam)}`;

        } else {

          backLink.href =
            `anime.html?malId=${encodeURIComponent(malId)}`;

        }


        /* =====================================================
           NAVIGATION
        ====================================================== */

        prevBtn.disabled =
          ep <= 1;


        nextBtn.disabled =
          false;


        /* =====================================================
           LOAD EPISODE LIST
        ====================================================== */

        loadEpisodeList(
          animeId
        );


      } catch (error) {

        console.error(
          "Watch page error:",
          error
        );


        skeleton.style.display =
          "none";

        infoContent.style.display =
          "block";


        showError(
          "Error Loading Episode",
          error.message ||
          "Could not load episode data."
        );

      }

    }


    /* =========================================================
       WATCH BUTTON
    ========================================================== */

    function renderWatchButton(
      url
    ) {

      if (!url) {

        watchArea.innerHTML = `
          <div class="text-center py-4">
            <p class="text-slate-400 text-sm">
              ⚠️ No video link saved for this episode.
            </p>
          </div>
        `;

        return;

      }


      /*
        This works for:

        Febbox
        Bunny.net
        Other video links

        It simply opens whatever URL
        is stored in Firestore.
      */

      watchArea.innerHTML = `
        <a
          href="${escapeAttribute(url)}"
          target="_blank"
          rel="noopener noreferrer"
          class="watch-btn"
        >
          ▶ WATCH EPISODE
        </a>

        <p class="text-center text-xs text-slate-600 mt-3">
          Opens video in a new tab
        </p>
      `;

    }


    /* =========================================================
       ERROR
    ========================================================== */

    function showError(
      title,
      message
    ) {

      watchArea.innerHTML =
        "";

      errorState.style.display =
        "block";

      document.getElementById(
        "errorTitle"
      ).textContent =
        title;

      document.getElementById(
        "errorMsg"
      ).textContent =
        message;

    }


    /* =========================================================
       LOAD EPISODE LIST
    ========================================================== */

    async function loadEpisodeList(
      animeId
    ) {

      try {

        const episodesRef =
          collection(
            db,
            "animes",
            String(animeId),
            "episodes"
          );


        const snapshot =
          await getDocs(
            episodesRef
          );


        const allEpisodes = [];


        snapshot.forEach(
          episodeDoc => {

            const data =
              episodeDoc.data();


            const episodeNumber =
              Number(
                data.episode
              );


            if (
              !episodeNumber ||
              episodeNumber < 1
            ) {

              return;

            }


            allEpisodes.push({

              episode:
                episodeNumber,

              title:
                data.title ||
                `Episode ${episodeNumber}`,

              video:
                data.febboxUrl ||
                data.video ||
                ""

            });

          }
        );


        allEpisodes.sort(
          (a, b) =>
            a.episode -
            b.episode
        );


        if (
          allEpisodes.length <= 1
        ) {

          return;

        }


        renderEpisodeList(
          allEpisodes,
          animeId
        );


      } catch (error) {

        console.error(
          "Episode list error:",
          error
        );

      }

    }


    /* =========================================================
       RENDER EPISODE LIST
    ========================================================== */

    function renderEpisodeList(
      episodes,
      animeId
    ) {

      epListWrap.style.display =
        "block";


      epList.innerHTML =
        episodes
          .map(
            episode => {

              const current =
                episode.episode === ep;


              const url =
                animeParam

                  ? `watch.html?anime=${encodeURIComponent(animeParam)}&ep=${episode.episode}`

                  : `watch.html?malId=${encodeURIComponent(malId)}&ep=${episode.episode}`;


              return `

                <a
                  href="${url}"
                  class="ep-row ${current ? "current" : ""}"
                >

                  <span
                    class="text-pink-400 font-bold text-sm min-w-[56px]"
                  >
                    Ep ${episode.episode}
                  </span>


                  <span
                    class="text-sm flex-1 ${
                      current
                        ? "text-white font-semibold"
                        : "text-white/60"
                    }"
                  >
                    ${escapeHtml(
                      episode.title
                    )}
                  </span>


                  ${
                    current

                      ? `
                        <span
                          class="text-xs bg-pink-500/30 text-pink-300 px-2 py-0.5 rounded-full ml-auto"
                        >
                          ▶ Playing
                        </span>
                      `

                      : ""
                  }

                </a>

              `;

            }
          )
          .join("");

    }


    /* =========================================================
       PREVIOUS EPISODE
    ========================================================== */

    prevBtn.onclick =
      () => {

        if (ep <= 1) {
          return;
        }


        if (animeParam) {

          window.location.href =
            `watch.html?anime=${encodeURIComponent(animeParam)}&ep=${ep - 1}`;

        } else {

          window.location.href =
            `watch.html?malId=${encodeURIComponent(malId)}&ep=${ep - 1}`;

        }

      };


    /* =========================================================
       NEXT EPISODE
    ========================================================== */

    nextBtn.onclick =
      () => {

        if (animeParam) {

          window.location.href =
            `watch.html?anime=${encodeURIComponent(animeParam)}&ep=${ep + 1}`;

        } else {

          window.location.href =
            `watch.html?malId=${encodeURIComponent(malId)}&ep=${ep + 1}`;

        }

      };


    /* =========================================================
       ESCAPE HTML
    ========================================================== */

    function escapeHtml(
      value
    ) {

      return String(value)

        .replace(
          /&/g,
          "&amp;"
        )

        .replace(
          /</g,
          "&lt;"
        )

        .replace(
          />/g,
          "&gt;"
        )

        .replace(
          /"/g,
          "&quot;"
        )

        .replace(
          /'/g,
          "&#039;"
        );

    }


    function escapeAttribute(
      value
    ) {

      return String(value)

        .replace(
          /&/g,
          "&amp;"
        )

        .replace(
          /"/g,
          "&quot;"
        )

        .replace(
          /</g,
          "&lt;"
        )

        .replace(
          />/g,
          "&gt;"
        );

    }


    /* =========================================================
       START
    ========================================================== */

    loadAnime();

  </script>

</body>
</html>
