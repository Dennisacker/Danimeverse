<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Watch Episode</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body {
      background: #050816;
      color: white;
      font-family: Arial, sans-serif;
    }

    .glass {
      background: rgba(255,255,255,0.05);
      backdrop-filter: blur(15px);
      border: 1px solid rgba(255,255,255,0.08);
    }
  </style>
</head>

<body class="p-4 md:p-8">

  <!-- VIDEO PLAYER -->
  <div class="glass rounded-2xl overflow-hidden">

    <iframe
      id="videoPlayer"
      class="w-full aspect-video"
      src=""
      allow="autoplay"
      allowfullscreen>
    </iframe>

  </div>

  <!-- EPISODE INFO -->
<div class="mt-6 glass rounded-2xl p-6 space-y-3">
<h2 class="text-sm text-white/50 mb-2">Now Playing</h2>
  <!-- Anime Name -->
  <p id="animeName"
     class="text-pink-400 uppercase tracking-widest text-sm font-semibold">
  </p>

  <!-- Episode Title -->
  <h1 id="episodeTitle"
      class="text-2xl md:text-3xl font-bold leading-tight">
  </h1>

  <!-- Divider -->
  <div class="w-full h-px bg-white/10"></div>

  

  <!-- Description -->
  <p id="episodeDesc"
     class="text-gray-300 leading-6 text-sm md:text-base">
  </p>

</div>

  <!-- BUTTONS -->
  <div class="mt-6 flex gap-4">
    
    <button class="border border-white/20 px-6 py-3 rounded-full hover:bg-white/10 transition">
      Download
    </button>
    <!-- PREVIOUS -->
  <button id="prevBtn"
    class="px-6 py-3 rounded-full border border-purple-500 text-purple-400 hover:bg-purple-500/10 transition">
    ◀ Previous
  </button>
<button id="nextBtn" class="bg-pink-600 px-6 py-3 rounded-full hover:bg-pink-500 transition">
  Next Episode ▶
</button>
  </div>

  <script>

    // GET URL DATA
   console.log("🎥 Watch page loaded");

const params = new URLSearchParams(window.location.search);

const anime = params.get("anime");
const video = params.get("video");
const ep = params.get("ep");
const title = params.get("title");
const desc = params.get("desc");

const player = document.getElementById("videoPlayer");
const animeName = document.getElementById("animeName");
const episodeTitle = document.getElementById("episodeTitle");
const episodeDesc = document.getElementById("episodeDesc");

/* =========================
   VIDEO SAFETY CHECK
========================= */

if (video) {
  player.src = video;
} else {
  console.log("❌ No video found in URL");
  player.src = "";

  // optional fallback message
  player.insertAdjacentHTML(
    "afterend",
    "<p style='color:red;text-align:center;margin-top:10px;'>No video provided</p>"
  );
}

/* =========================
   TEXT INFO
========================= */

if (animeName) animeName.textContent = anime || "Anime";

if (episodeTitle)
 episodeTitle.textContent =
  title || `Episode ${ep || "?"}`;

if (episodeDesc)
  episodeDesc.textContent = desc || "No description available.";
document.addEventListener("DOMContentLoaded", () => {
  const prevBtn = document.getElementById("prevBtn");
  const nextBtn = document.getElementById("nextBtn");

  const params = new URLSearchParams(window.location.search);

  const anime = params.get("anime") || "";
  const video = params.get("video") || "";
  const desc = params.get("desc") || "";

  let ep = parseInt(params.get("ep")) || 1;

  /* =========================
     NEXT EPISODE
  ========================= */
  if (nextBtn) {
    nextBtn.addEventListener("click", () => {
      const nextEp = ep + 1;

      const url =
        `watch.html?anime=${encodeURIComponent(anime)}` +
        `&ep=${nextEp}` +
        `&title=${encodeURIComponent("Episode " + nextEp)}` +
        `&desc=${encodeURIComponent(desc)}` +
        `&video=${encodeURIComponent(video)}`;

      window.location.href = url;
    });
  }

  /* =========================
     PREVIOUS EPISODE
  ========================= */
  if (prevBtn) {
    prevBtn.addEventListener("click", () => {
      const prevEp = ep - 1;

      if (prevEp < 1) return;

      const url =
        `watch.html?anime=${encodeURIComponent(anime)}` +
        `&ep=${prevEp}` +
        `&title=${encodeURIComponent("Episode " + prevEp)}` +
        `&desc=${encodeURIComponent(desc)}` +
        `&video=${encodeURIComponent(video)}`;

      window.location.href = url;
    });
  }
});
  </script>

</body>
</html>
