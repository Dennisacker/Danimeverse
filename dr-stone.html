<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
     <link rel="icon" type="image/png" href="https://i.pinimg.com/736x/fc/8d/c0/fc8dc0a1f0db8842d9c58373acd655a8.jpg">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dr. Stone | Danimeverse</title>

  <link rel="stylesheet" href="tailwind.min.css">

  <style>
    body {
      font-family: Inter, sans-serif;
      background: #050816;
      color: white;
      overflow-x: hidden;
    }

    .glass {
      background: rgba(255,255,255,0.05);
      backdrop-filter: blur(18px);
      border: 1px solid rgba(255,255,255,0.08);
    }

    .hero-overlay {
      background: linear-gradient(
        to top,
        rgba(5,8,22,1),
        rgba(5,8,22,0.7),
        rgba(5,8,22,0.3)
      );
    }

    .episode-card:hover {
      transform: translateY(-4px);
    }
  </style>
</head>

<body>

  <!-- HERO SECTION -->
  <section class="relative h-[70vh] overflow-hidden">

    <img
      src="https://i.pinimg.com/736x/21/47/ed/2147ed6979caf6ea49a57d74fb0bb6c8.jpg"
      class="absolute inset-0 h-full w-full object-cover"
    />

    <div class="hero-overlay absolute inset-0"></div>

    <div class="relative z-10 flex h-full items-end">

      <div class="mx-auto flex w-full max-w-7xl flex-col gap-6 px-6 pb-10 md:flex-row md:items-end">

        <!-- POSTER -->
        <img
          src="https://cdn.myanimelist.net/images/anime/1613/102576.jpg"
          class="w-44 rounded-2xl shadow-2xl"
        />

        <!-- INFO -->
        <div class="max-w-3xl">

          <p class="mb-3 text-pink-500 font-semibold uppercase tracking-[0.3em]">
            Anime Series
          </p>

          <h1 class="text-4xl md:text-6xl font-black">
            Dr. Stone
          </h1>

          <!-- TAGS -->
          <div class="mt-4 flex flex-wrap gap-2">

            <span class="rounded-full bg-cyan-500/20 px-3 py-1 text-sm text-cyan-300">
              Sci-Fi
            </span>

            <span class="rounded-full bg-yellow-500/20 px-3 py-1 text-sm text-yellow-300">
              Adventure
            </span>

            <span class="rounded-full bg-green-500/20 px-3 py-1 text-sm text-green-300">
              Comedy
            </span>

          </div>

          <!-- DESCRIPTION -->
          <p class="mt-5 max-w-2xl text-slate-300 leading-7">
            Thousands of years after humanity is mysteriously petrified, genius scientist Senku Ishigami leads the Kingdom of Science to rebuild civilization through innovation, discovery, and unstoppable determination.
          </p>

          <!-- BUTTONS -->
          <div class="mt-6 flex flex-wrap gap-4">

            <button class="rounded-full bg-pink-600 px-6 py-3 font-semibold hover:bg-pink-500 transition">
              ▶ Watch Now
            </button>

            <button class="rounded-full border border-white/20 px-6 py-3 hover:bg-white/10 transition">
              + My List
            </button>

          </div>

        </div>

      </div>

    </div>

  </section>

<!-- EPISODES -->
<section class="mx-auto max-w-7xl px-6 py-16">

  <div class="mb-8 flex items-center justify-between">
    <h2 class="text-3xl font-bold">Episodes</h2>
    <span class="text-slate-400">Season 1-4</span>
  </div>
<!-- SEASON BUTTONS -->
<div class="mb-8 flex gap-3 flex-wrap">

  <button onclick="showSeason(1)" class="rounded-full bg-cyan-600 px-5 py-2 hover:bg-cyan-500 transition">
    Season 1
  </button>

  <button onclick="showSeason(2)" class="rounded-full bg-green-600 px-5 py-2 hover:bg-green-500 transition">
    Season 2
  </button>

  <button onclick="showSeason(3)" class="rounded-full bg-yellow-600 px-5 py-2 hover:bg-yellow-500 transition">
    Season 3
  </button>

  <button onclick="showSeason(4)" class="rounded-full bg-slate-600 px-5 py-2 hover:bg-slate-500 transition">
    Season 4
  </button>

  <button onclick="showSeason('special')" class="rounded-full bg-pink-600 px-5 py-2 hover:bg-pink-500 transition">
    Special
  </button>

</div>
  </div>
 <!-- EPISODES LIST -->
  <div id="episodeList" class="grid gap-4 md:grid-cols-2"></div>

</section>


</section>

<script>
document.addEventListener("DOMContentLoaded", () => {

  const episodeList = document.getElementById("episodeList");

  const season1 = [];
  const season2 = [];
  const season3 = [];
  const season4 = [];
  const special = []; // 👈 NEW

  /* =========================
     SEASON 1 (24)
  ========================= */
  for (let i = 1; i <= 24; i++) {
    season1.push({
      ep: i,
      title: `Dr. Stone S1 Episode ${i}`,
      desc: `Watch Dr. Stone Season 1 Episode ${i}.`,
      image: "https://i.pinimg.com/736x/21/47/ed/2147ed6979caf6ea49a57d74fb0bb6c8.jpg",
      video: "https://player.mediadelivery.net/embed/673018/35592cb4-0c78-4267-bab2-45d9723b8955"
    });
  }

  /* =========================
     SEASON 2 (11)
  ========================= */
  for (let i = 1; i <= 11; i++) {
    season2.push({
      ep: i,
      title: `Dr. Stone S2 Episode ${i}`,
      desc: `Watch Dr. Stone Season 2 Episode ${i}.`,
      image: "https://i.pinimg.com/736x/35/d4/94/35d49432ea01ca3295c523fed577e745.jpg",
      video: "https://player.mediadelivery.net/embed/673018/35592cb4-0c78-4267-bab2-45d9723b8955"
    });
  }

  /* =========================
     SEASON 3 (22)
  ========================= */
  for (let i = 1; i <= 22; i++) {
    season3.push({
      ep: i,
      title: `Dr. Stone S3 Episode ${i}`,
      desc: `Watch Dr. Stone New World Episode ${i}.`,
      image: "https://i.pinimg.com/1200x/01/d6/85/01d685a66cf1ea0b35747f389408a745.jpg",
      video: "https://player.mediadelivery.net/embed/673018/35592cb4-0c78-4267-bab2-45d9723b8955"
    });
  }

  /* =========================
     SEASON 4 (33)
  ========================= */
  for (let i = 1; i <= 33; i++) {
    season4.push({
      ep: i,
      title: `Dr. Stone S4 Episode ${i}`,
      desc: `Watch Dr. Stone Science Future Episode ${i}.`,
      image: "https://i.pinimg.com/1200x/98/a6/c9/98a6c97611d7859c4037cd875bf91008.jpg",
      video: "https://player.mediadelivery.net/embed/673018/35592cb4-0c78-4267-bab2-45d9723b8955"
    });
  }

  /* =========================
     SPECIAL (1 EPISODE)
  ========================= */
  special.push({
    ep: "Special",
    title: "Dr. Stone Canon Special Episode",
    desc: "Official canon special episode.",
    image: "https://i.pinimg.com/736x/27/e0/3e/27e03e285885daaf8da8ccd25fd2202f.jpg",
    video: "https://player.mediadelivery.net/embed/673018/35592cb4-0c78-4267-bab2-45d9723b8955"
  });

  /* =========================
     RENDER
  ========================= */
  function render(data) {
    episodeList.innerHTML = "";

    data.forEach(ep => {
      episodeList.innerHTML += `
        <a href="watch.html?anime=DrStone&ep=${ep.ep}&title=${encodeURIComponent(ep.title)}&desc=${encodeURIComponent(ep.desc)}&video=${encodeURIComponent(ep.video)}">

          <div class="episode-card glass flex gap-4 rounded-2xl p-4 hover:bg-white/5 transition">

            <img src="${ep.image}" class="h-24 w-40 rounded-xl object-cover"/>

            <div>
              <p class="text-sm text-cyan-400">Episode ${ep.ep}</p>
              <h3 class="mt-1 text-lg font-semibold">${ep.title}</h3>
              <p class="mt-2 text-sm text-slate-400">${ep.desc}</p>
            </div>

          </div>

        </a>
      `;
    });
  }

  /* =========================
     GLOBAL SWITCH
  ========================= */
  window.showSeason = function(season) {
    if (season === 1) render(season1);
    if (season === 2) render(season2);
    if (season === 3) render(season3);
    if (season === 4) render(season4);
    if (season === "special") render(special); // 👈 NEW BUTTON TYPE
  };

  /* AUTO LOAD */
  showSeason(1);

});
</script>
</body>
</html>
