<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Jujutsu Kaisen | Danimeverse</title>

  <link rel="stylesheet" href="tailwind.min.css">
    <link rel="stylesheet" href="anime-bg.css">

  <style>
    body {
      font-family: Inter, sans-serif;
      background: #050816;
      color: white;
      overflow-x: hidden;
    }

    .glass {
      background: rgba(255,255,255,0.05);
      backdrop-filter: blur(18px);
      border: 1px solid rgba(255,255,255,0.08);
    }

    .hero-overlay {
      background: linear-gradient(
        to top,
        rgba(5,8,22,1),
        rgba(5,8,22,0.7),
        rgba(5,8,22,0.3)
      );
    }

    .episode-card:hover {
      transform: translateY(-4px);
    }
  </style>
</head>

<body>

  <!-- HERO SECTION -->
  <section class="relative h-[70vh] overflow-hidden">

    <img
      src="https://wallpapercave.com/wp/wp6800214.jpg"
      class="absolute inset-0 h-full w-full object-cover"
    />

    <div class="hero-overlay absolute inset-0"></div>

    <div class="relative z-10 flex h-full items-end">

      <div class="mx-auto flex w-full max-w-7xl flex-col gap-6 px-6 pb-10 md:flex-row md:items-end">

        <!-- POSTER -->
        <img
          src="https://cdn.myanimelist.net/images/anime/1171/109222.jpg"
          class="w-44 rounded-2xl shadow-2xl"
        />

        <!-- INFO -->
        <div class="max-w-3xl">

          <p class="mb-3 text-pink-500 font-semibold uppercase tracking-[0.3em]">
            Anime Series
          </p>

          <h1 class="text-4xl md:text-6xl font-black">
            Jujutsu Kaisen
          </h1>

          <div class="mt-4 flex flex-wrap gap-2">

            <span class="rounded-full bg-pink-500/20 px-3 py-1 text-sm text-pink-300">
              Action
            </span>

            <span class="rounded-full bg-purple-500/20 px-3 py-1 text-sm text-purple-300">
              Dark Fantasy
            </span>

            <span class="rounded-full bg-indigo-500/20 px-3 py-1 text-sm text-indigo-300">
              Supernatural
            </span>

          </div>

          <p class="mt-5 max-w-2xl text-slate-300 leading-7">
            Yuji Itadori joins Tokyo Jujutsu High after becoming host to a powerful curse. Alongside fellow sorcerers, he battles terrifying cursed spirits threatening humanity.
          </p>

          <!-- BUTTONS -->
          <div class="mt-6 flex flex-wrap gap-4">

            <button class="rounded-full bg-pink-600 px-6 py-3 font-semibold hover:bg-pink-500 transition">
              ▶ Watch Now
            </button>

            <button class="rounded-full border border-white/20 px-6 py-3 hover:bg-white/10 transition">
              + My List
            </button>

          </div>

        </div>

      </div>

    </div>

  </section>

  <!-- EPISODES -->
  <section class="mx-auto max-w-7xl px-6 py-16">

    <div class="mb-8 flex items-center justify-between">

      <h2 class="text-3xl font-bold">
        Episodes
      </h2>

      <span class="text-slate-400">
        Season 3
      </span>

    </div>

    <!-- SEASON BUTTONS -->
<div class="mb-8 flex gap-3 flex-wrap">

  <button onclick="showSeason(1)"
    class="rounded-full bg-pink-600 px-5 py-2 hover:bg-pink-500 transition">
    Season 1
  </button>

  <button onclick="showSeason(2)"
    class="rounded-full bg-purple-600 px-5 py-2 hover:bg-purple-500 transition">
    Season 2
  </button>

  <button onclick="showSeason(3)"
    class="rounded-full bg-indigo-600 px-5 py-2 hover:bg-indigo-500 transition">
    Season 3
  </button>

</div>

<!-- EPISODE LIST -->
<div
  id="episodeList"
  class="grid gap-4 md:grid-cols-2">
</div>

</section>
<script>

const episodeList = document.getElementById("episodeList");

/* =========================
   SEASON ARRAYS
========================= */

const season1Episodes = [];
const season2Episodes = [];
const season3Episodes = [];

/* =========================
   SEASON 1
========================= */

for (let i = 1; i <= 24; i++) {

  season1Episodes.push({

    ep: i,

    title: `Jujutsu Kaisen S1 Episode ${i}`,

    desc: `Watch Jujutsu Kaisen Season 1 Episode ${i}.`,

    image: "https://cdn.myanimelist.net/images/anime/1171/109222.jpg",

    video: "https://streamtape.com/e/GAgGMmwRlXi1k3D/"

  });

}

/* =========================
   SEASON 2
========================= */

for (let i = 1; i <= 24; i++) {

  season2Episodes.push({

    ep: i,

    title: `Jujutsu Kaisen S2 Episode ${i}`,

    desc: `Watch Jujutsu Kaisen Season 2 Episode ${i}.`,

   image: "https://i.pinimg.com/1200x/71/58/21/7158211d2c8ce9f46a323de125993910.jpg",

    video: "https://streamtape.com/e/GAgGMmwRlXi1k3D/"

  });

}

/* =========================
   SEASON 3
========================= */

for (let i = 1; i <= 12; i++) {

  season3Episodes.push({

    ep: i,

    title: `Jujutsu Kaisen S3 Episode ${i}`,

    desc: `Watch Jujutsu Kaisen Season 3 Episode ${i}.`,

    image: "https://i.pinimg.com/736x/cf/01/81/cf0181a515d6e53165dffd942f7bb9b8.jpg",

    video: "https://streamtape.com/e/GAgGMmwRlXi1k3D/"

  });

}

/* =========================
   SHOW SEASON
========================= */

function showSeason(season) {

  episodeList.innerHTML = "";

  let selectedSeason = [];

  if (season == 1) {
    selectedSeason = season1Episodes;
  }

  if (season == 2) {
    selectedSeason = season2Episodes;
  }

  if (season == 3) {
    selectedSeason = season3Episodes;
  }

  selectedSeason.forEach(ep => {

    episodeList.innerHTML += `

      <a href="watch.html?anime=Jujutsu%20Kaisen&ep=${ep.ep}&title=${encodeURIComponent(ep.title)}&desc=${encodeURIComponent(ep.desc)}&video=${encodeURIComponent(ep.video)}">

        <div class="episode-card glass flex gap-4 rounded-2xl p-4 transition duration-300 hover:bg-white/5">

          <img
            src="${ep.image}"
            class="h-24 w-40 rounded-xl object-cover"
          />

          <div>

            <p class="text-sm text-pink-400">
              Episode ${ep.ep}
            </p>

            <h3 class="mt-1 text-lg font-semibold">
              ${ep.title}
            </h3>

            <p class="mt-2 text-sm text-slate-400">
              ${ep.desc}
            </p>

          </div>

        </div>

      </a>

    `;

  });

}

/* =========================
   AUTO LOAD SEASON 3
========================= */

showSeason(3);

</script>
</body>
</html>
