<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Danimeverse | Create Account</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background:
        linear-gradient(to bottom, rgba(5,5,20,.85), rgba(10,10,30,.95)),
        url('https://images6.alphacoders.com/136/1369021.jpeg');
      background-size: cover;
      background-position: center;
      min-height: 100vh;
      font-family: Arial, sans-serif;
    }
    .glass {
      backdrop-filter: blur(14px);
      background: rgba(15,15,35,.75);
      border: 1px solid rgba(255,255,255,.08);
      box-shadow: 0 0 40px rgba(168,85,247,.15);
    }

    /* Gender picker */
    .gender-option { display: none; }
    .gender-label {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 1;
      justify-content: center;
      padding: 12px 0;
      border-radius: 12px;
      border: 1.5px solid rgba(255,255,255,0.12);
      color: #94a3b8;
      cursor: pointer;
      transition: all 0.2s ease;
      font-size: 14px;
      font-weight: 600;
    }
    .gender-label:hover {
      border-color: rgba(236,72,153,0.4);
      color: white;
    }
    .gender-option:checked + .gender-label {
      border-color: #ec4899;
      color: white;
      background: rgba(236,72,153,0.12);
    }
    .gender-option#genderMale:checked + .gender-label {
      border-color: #60a5fa;
      background: rgba(96,165,250,0.12);
      color: #93c5fd;
    }
  </style>
</head>

<body class="flex items-center justify-center p-6">
  <div class="glass w-full max-w-md rounded-3xl p-8">

    <h1 class="text-4xl font-black text-pink-500 text-center">DANIMEVERSE</h1>
    <p class="text-slate-400 text-center mt-2 mb-8">Create your anime universe account.</p>

    <form id="signUpForm">

      <!-- USERNAME -->
      <div class="mb-5">
        <label class="text-sm text-slate-300 mb-2 block">Username</label>
        <input
          type="text"
          id="signupUsername"
          placeholder="Choose a username"
          required
          class="w-full bg-[#111827] border border-white/10 rounded-xl px-4 py-4
                 text-white outline-none focus:border-pink-500"
        />
      </div>

      <!-- EMAIL -->
      <div class="mb-5">
        <label class="text-sm text-slate-300 mb-2 block">Email Address</label>
        <input
          type="email"
          id="email"
          placeholder="Enter your email"
          required
          class="w-full bg-[#111827] border border-white/10 rounded-xl px-4 py-4
                 text-white outline-none focus:border-pink-500"
        />
      </div>

      <!-- PASSWORD -->
      <div class="mb-6">
        <label class="text-sm text-slate-300 mb-2 block">Password</label>
        <input
          type="password"
          id="password"
          placeholder="Create a password"
          required
          class="w-full bg-[#111827] border border-white/10 rounded-xl px-4 py-4
                 text-white outline-none focus:border-pink-500"
        />
      </div>

      <!-- GENDER -->
      <div class="mb-7">
        <label class="text-sm text-slate-300 mb-3 block">I am a...</label>
        <div class="flex gap-3">

          <input type="radio" name="gender" id="genderMale" value="male" class="gender-option" required />
          <label for="genderMale" class="gender-label">
            <!-- Male icon -->
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
              <circle cx="12" cy="6" r="4"/>
              <path d="M12 13c-4 0-7 2.2-7 5v1h14v-1c0-2.8-3-5-7-5z"/>
              <rect x="11" y="17" width="2" height="5" rx="1"/>
              <rect x="8" y="20" width="8" height="2" rx="1"/>
            </svg>
            Male
          </label>

          <input type="radio" name="gender" id="genderFemale" value="female" class="gender-option" />
          <label for="genderFemale" class="gender-label">
            <!-- Female icon -->
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
              <circle cx="12" cy="6" r="4"/>
              <path d="M12 13c-4 0-7 2.2-7 5v1h14v-1c0-2.8-3-5-7-5z"/>
              <path d="M9 12.5c-.5 2 0 4 1 5.5h4c1-1.5 1.5-3.5 1-5.5" opacity="0.35"/>
            </svg>
            Female
          </label>

        </div>
      </div>

      <!-- SUBMIT -->
      <button
        type="submit"
        class="w-full bg-pink-600 hover:bg-pink-700 transition
               text-white font-bold py-4 rounded-xl"
      >
        Create Account
      </button>

    </form>

    <div class="flex justify-between text-sm text-slate-400 mt-5">
      <a href="sign-in.html" class="hover:text-pink-400 transition">Already have an account?</a>
      <a href="index.html" class="hover:text-pink-400 transition">Back Home</a>
    </div>

  </div>

  <script type="module" src="auth.js"></script>
</body>
</html>
