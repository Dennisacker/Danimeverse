<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>Danimeverse | Create Account</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body{
      background:
      linear-gradient(to bottom, rgba(5,5,20,.85), rgba(10,10,30,.95)),
      url('https://images6.alphacoders.com/136/1369021.jpeg');

      background-size: cover;
      background-position: center;
      min-height: 100vh;
      font-family: Arial, sans-serif;
    }

    .glass{
      backdrop-filter: blur(14px);
      background: rgba(15,15,35,.75);
      border: 1px solid rgba(255,255,255,.08);
      box-shadow: 0 0 40px rgba(168,85,247,.15);
    }
  </style>
</head>

<body class="flex items-center justify-center p-6">

  <div class="glass w-full max-w-md rounded-3xl p-8">

    <!-- LOGO -->
    <h1 class="text-4xl font-black text-pink-500 text-center">
      DANIMEVERSE
    </h1>

    <p class="text-slate-400 text-center mt-2 mb-8">
      Create your anime universe account.
    </p>

    <form id="signUpForm">

      <!-- USERNAME -->
      <div class="mb-5">

        <label class="text-sm text-slate-300 mb-2 block">
          Username
        </label>

        <input
          type="text"
          id="signupUsername"
          placeholder="Choose a username"
          class="w-full bg-[#111827] border border-white/10 rounded-xl px-4 py-4
                 text-white outline-none focus:border-pink-500"
        />

      </div>

      <!-- EMAIL -->
      <div class="mb-5">

        <label class="text-sm text-slate-300 mb-2 block">
          Email Address
        </label>

        <input
          type="email"
          id="email"
          placeholder="Enter your email"
          class="w-full bg-[#111827] border border-white/10 rounded-xl px-4 py-4
                 text-white outline-none focus:border-pink-500"
        />

      </div>

      <!-- PASSWORD -->
      <div class="mb-6">

        <label class="text-sm text-slate-300 mb-2 block">
          Password
        </label>

        <input
          type="password"
          id="password"
          placeholder="Create a password"
          class="w-full bg-[#111827] border border-white/10 rounded-xl px-4 py-4
                 text-white outline-none focus:border-pink-500"
        />

      </div>

      <!-- BUTTON -->
      <button
        type="submit"
        class="w-full bg-pink-600 hover:bg-pink-700 transition
               text-white font-bold py-4 rounded-xl"
      >
        Create Account
      </button>

    </form>

    <!-- EXTRA -->
    <div class="flex justify-between text-sm text-slate-400 mt-5">

      <a href="sign-in.html" class="hover:text-pink-400 transition">
        Already have an account?
      </a>

      <a href="index.html" class="hover:text-pink-400 transition">
        Back Home
      </a>

    </div>

  </div>

  <script type="module" src="auth.js"></script>

</body>
</html>
