  >

  <style>

    body {
      background:
        linear-gradient(
          to bottom,
          rgba(5,5,20,.85),
          rgba(10,10,30,.95)
        ),
        url('https://images6.alphacoders.com/136/1369021.jpeg');

      background-size: cover;
      background-position: center;

      min-height: 100vh;

      font-family: Arial, sans-serif;
    }


    .glass {
      backdrop-filter: blur(14px);

      background:
        rgba(15,15,35,.75);

      border:
        1px solid rgba(255,255,255,.08);

      box-shadow:
        0 0 40px rgba(168,85,247,.15);
    }


    /* GOOGLE BUTTON */

    .google-button {

      width: 100%;

      display: flex;

      align-items: center;

      justify-content: center;

      gap: 12px;

      background: #ffffff;

      color: #1f2937;

      border: 1px solid #d1d5db;

      font-weight: 700;

      padding: 14px 20px;

      border-radius: 12px;

      cursor: pointer;

      transition:
        background 0.2s ease,
        transform 0.2s ease,
        box-shadow 0.2s ease;

    }


    .google-button:hover {

      background: #f3f4f6;

      box-shadow:
        0 5px 20px rgba(0,0,0,.25);

      transform:
        translateY(-1px);

    }


    .google-button:active {

      transform:
        translateY(0);

    }


    .google-button:disabled {

      opacity: .7;

      cursor:
        not-allowed;

      transform:
        none;

    }


    .divider {

      display: flex;

      align-items: center;

      gap: 12px;

      margin: 24px 0;

      color: #64748b;

      font-size: 13px;

    }


    .divider::before,
    .divider::after {

      content: "";

      flex: 1;

      height: 1px;

      background:
        rgba(255,255,255,.1);

    }


    .google-spinner {

      width: 18px;

      height: 18px;

      border:
        3px solid #d1d5db;

      border-top-color:
        #4285F4;

      border-radius: 50%;

      animation:
        spin .8s linear infinite;

    }


    @keyframes spin {

      to {
        transform:
          rotate(360deg);
      }

    }

  </style>

</head>

<!-- EMAIL LOGIN -->

<form id="signInForm">

  <!-- EMAIL -->

  <div class="mb-5">

    <label
      class="text-sm text-slate-300 mb-2 block"
    >
      Email Address
    </label>


    <input
      type="email"
      id="loginEmail"
      placeholder="Enter your email"
      required
      class="w-full bg-[#111827] border border-white/10 rounded-xl px-4 py-4
             text-white outline-none focus:border-pink-500"
    />

  </div>


  <!-- PASSWORD -->

  <div class="mb-4">

    <label
      class="text-sm text-slate-300 mb-2 block"
    >
      Password
    </label>


    <input
      type="password"
      id="loginPassword"
      placeholder="Enter your password"
      required
      class="w-full bg-[#111827] border border-white/10 rounded-xl px-4 py-4
             text-white outline-none focus:border-pink-500"
    />

  </div>


  <!-- REMEMBER ME -->

  <div
    class="flex items-center mb-6 text-sm text-slate-300"
  >

    <label
      class="flex items-center gap-2"
    >

      <input
        type="checkbox"
        id="rememberMe"
        class="accent-pink-500"
      >

      Remember me

    </label>

  </div>


  <!-- SIGN IN BUTTON -->

  <button
    type="submit"
    class="w-full bg-pink-600 hover:bg-pink-700 transition
           text-white font-bold py-4 rounded-xl"
  >

    Sign In

  </button>

</form>
