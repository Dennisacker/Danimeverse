<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Admin Dashboard</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #050816;
  color: white;
  display: flex;
  height: 100vh;
}

/* LEFT PANEL */
.left {
  width: 35%;
  background: rgba(255,255,255,0.03);
  padding: 20px;
  border-right: 1px solid rgba(255,255,255,0.08);
  overflow-y: auto;
}

.title {
  font-size: 20px;
  font-weight: bold;
  margin-bottom: 15px;
}

/* INPUTS */
input, button {
  width: 100%;
  padding: 12px;
  margin-top: 10px;
  border-radius: 10px;
  border: none;
}

input {
  background: #111;
  color: white;
}

button {
  background: #ec4899;
  color: white;
  font-weight: bold;
  cursor: pointer;
}

button:hover {
  background: #db2777;
}

/* EPISODE LIST */
.ep {
  padding: 10px;
  margin-top: 8px;
  background: rgba(255,255,255,0.05);
  border-radius: 8px;
  cursor: pointer;
}

.ep:hover {
  background: rgba(236,72,153,0.2);
}

/* RIGHT PANEL */
.right {
  flex: 1;
  padding: 30px;
}

.card {
  background: rgba(255,255,255,0.04);
  padding: 20px;
  border-radius: 15px;
  border: 1px solid rgba(255,255,255,0.08);
}

.animeTitle {
  font-size: 24px;
  font-weight: bold;
  margin-bottom: 10px;
  color: #ec4899;
}

.small {
  opacity: 0.7;
  font-size: 13px;
}
</style>
</head>

<body>

<!-- LEFT -->
<div class="left">

  <div class="title">🎬 Admin Panel</div>

  <input id="animeSearch" placeholder="Anime name (Naruto...)" />
  <button id="loadAnime">Load Anime</button>

  <div id="episodeList"></div>

</div>

<!-- RIGHT -->
<div class="right">

  <div class="card">

    <div class="animeTitle" id="animeTitle">No anime selected</div>
    <div class="small" id="animeSlug"></div>

    <input id="episode" placeholder="Episode number" />
    <input id="title" placeholder="Episode title" />
    <input id="video" placeholder="Video link (Bunny / Febbox / Drive)" />

    <button id="uploadBtn">Upload Episode</button>

  </div>

</div>

<script type="module" src="./admin.js"></script>

</body>
</html>
