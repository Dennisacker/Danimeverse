<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Danimeverse Admin</title>

  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex items-center justify-center">

  <div class="w-full max-w-md bg-slate-800 p-6 rounded-xl">

    <h1 class="text-3xl font-bold mb-6 text-center">
      Danimeverse Admin
    </h1>

    <input
      id="anime"
      type="text"
      placeholder="Anime Name"
      class="w-full mb-4 p-3 rounded bg-slate-700"
    >

    <input
      id="episode"
      type="number"
      placeholder="Episode Number"
      class="w-full mb-4 p-3 rounded bg-slate-700"
    >

    <textarea
      id="video"
      placeholder="Bunny Embed URL"
      class="w-full mb-4 p-3 rounded bg-slate-700 h-32"
    ></textarea>

    <button
      id="saveBtn"
      class="w-full bg-pink-600 p-3 rounded font-bold hover:bg-pink-500"
    >
      Save Episode
    </button>

    <p id="status" class="mt-4 text-center"></p>

  </div>

  <script type="module" src="admin.js"></script>

</body>
</html>
