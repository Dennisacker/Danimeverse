<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Fire Force | Danimeverse</title>

  <link rel="stylesheet" href="tailwind.min.css">
    <link rel="stylesheet" href="anime-bg.css">

  <style>
    body {
      font-family: Inter, sans-serif;
      background: #050816;
      color: white;
      overflow-x: hidden;
    }

    .glass {
      background: rgba(255,255,255,0.05);
      backdrop-filter: blur(18px);
      border: 1px solid rgba(255,255,255,0.08);
    }

    .hero-overlay {
      background: linear-gradient(
        to top,
        rgba(5,8,22,1),
        rgba(5,8,22,0.7),
        rgba(5,8,22,0.3)
      );
    }

    .episode-card:hover {
      transform: translateY(-4px);
    }
  </style>
</head>

<body>

  <!-- HERO -->
  <section class="relative h-[70vh] overflow-hidden">

    <img
      src="https://wallpapercave.com/wp/wp5128418.jpg"
      class="absolute inset-0 h-full w-full object-cover"
    />

    <div class="hero-overlay absolute inset-0"></div>

    <div class="relative z-10 flex h-full items-end">

      <div class="mx-auto flex w-full max-w-7xl flex-col gap-6 px-6 pb-10 md:flex-row md:items-end">

        <!-- Poster -->
        <img
          src="https://i.pinimg.com/736x/3d/cc/92/3dcc922e4572551a846c4a9323b006fb.jpg"
          class="w-44 rounded-2xl shadow-2xl"
        />

        <!-- Info -->
        <div class="max-w-3xl">

          <p class="mb-3 text-pink-500 font-semibold uppercase tracking-[0.3em]">
            Anime Series
          </p>

          <h1 class="text-4xl md:text-6xl font-black">
            Fire Force
          </h1>

          <!-- Tags -->
          <div class="mt-4 flex flex-wrap gap-2">

            <span class="rounded-full bg-red-500/20 px-3 py-1 text-sm text-red-300">
              Action
            </span>

            <span class="rounded-full bg-orange-500/20 px-3 py-1 text-sm text-orange-300">
              Fantasy
            </span>

            <span class="rounded-full bg-yellow-500/20 px-3 py-1 text-sm text-yellow-300">
              Supernatural
            </span>

          </div>

          <!-- Description -->
          <p class="mt-5 max-w-2xl text-slate-300 leading-7">
            In a world plagued by spontaneous human combustion, Shinra Kusakabe joins Special Fire Force Company 8 to uncover the truth behind the infernals, hidden conspiracies, and the flames threatening humanity itself.
          </p>

          <!-- Buttons -->
          <div class="mt-6 flex flex-wrap gap-4">

            <button class="rounded-full bg-pink-600 px-6 py-3 font-semibold hover:bg-pink-500 transition">
              ▶ Watch Now
            </button>

            <button class="rounded-full border border-white/20 px-6 py-3 hover:bg-white/10 transition">
              + My List
            </button>

          </div>

        </div>

      </div>

    </div>

  </section>

  <!-- EPISODES SECTION -->
<section class="mx-auto max-w-7xl px-6 py-16">

  <div class="mb-8 flex items-center justify-between">
    <h2 class="text-3xl font-bold">Episodes</h2>
    <span class="text-slate-400">Season Hub</span>
  </div>

  <!-- BUTTONS (NOT inside grid) -->
  <div class="mb-8 flex gap-3 flex-wrap">

    <button onclick="showSeason(1)" class="rounded-full bg-red-600 px-5 py-2 hover:bg-red-500 transition">
      Season 1
    </button>

    <button onclick="showSeason(2)" class="rounded-full bg-orange-600 px-5 py-2 hover:bg-orange-500 transition">
      Season 2
    </button>

    <button onclick="showSeason('s3p1')" class="rounded-full bg-yellow-600 px-5 py-2 hover:bg-yellow-500 transition">
      Season 3 Part 1
    </button>

    <button onclick="showSeason('s3p2')" class="rounded-full bg-purple-600 px-5 py-2 hover:bg-purple-500 transition">
      Season 3 Part 2
    </button>

  </div>

  <!-- EPISODES LIST -->
  <div id="episodeList" class="grid gap-4 md:grid-cols-2"></div>

</section>
      <script>
document.addEventListener("DOMContentLoaded", () => {

  const episodeList = document.getElementById("episodeList");

  const season1 = [];
  const season2 = [];
  const s3p1 = [];
  const s3p2 = [];

  /* SEASON 1 - 24 EP */
  for (let i = 1; i <= 24; i++) {
    season1.push({
      ep: i,
      title: `Fire Force S1 Episode ${i}`,
      desc: `Watch Fire Force Season 1 Episode ${i}`,
      image: "https://i.pinimg.com/236x/12/6f/43/126f435923ebdc2c11d66415866c7e19.jpg",
      video: "https://streamtape.com/e/GAgGMmwRlXi1k3D/"
    });
  }

  /* SEASON 2 - 24 EP */
  for (let i = 1; i <= 24; i++) {
    season2.push({
      ep: i,
      title: `Fire Force S2 Episode ${i}`,
      desc: `Watch Fire Force Season 2 Episode ${i}`,
      image: "https://i.pinimg.com/1200x/cf/1b/06/cf1b06b4184885fbe00375c00e427965.jpg",
      video: "https://streamtape.com/e/GAgGMmwRlXi1k3D/"
    });
  }

  /* SEASON 3 PART 1 - 12 EP */
  for (let i = 1; i <= 12; i++) {
    s3p1.push({
      ep: i,
      title: `Fire Force S3 Part 1 Episode ${i}`,
      desc: `Watch Fire Force Season 3 Part 1 Episode ${i}`,
      image: "https://i.pinimg.com/736x/94/7c/ca/947ccac3aad2d9a72a5ad7bb115b9544.jpg",
      video: "https://streamtape.com/e/GAgGMmwRlXi1k3D/"
    });
  }

  /* SEASON 3 PART 2 - 13 EP */
  for (let i = 1; i <= 13; i++) {
    s3p2.push({
      ep: i,
      title: `Fire Force S3 Part 2 Episode ${i}`,
      desc: `Watch Fire Force Season 3 Part 2 Episode ${i}`,
      image: "https://i.pinimg.com/736x/6d/e7/ce/6de7ce1e24c93ae5759704725dcc6086.jpg",
      video: "https://streamtape.com/e/GAgGMmwRlXi1k3D/"
    });
  }

  function render(data) {
    episodeList.innerHTML = "";

    data.forEach(ep => {
      episodeList.innerHTML += `
        <a href="watch.html?anime=FireForce&ep=${ep.ep}&title=${encodeURIComponent(ep.title)}&desc=${encodeURIComponent(ep.desc)}&video=${encodeURIComponent(ep.video)}">

          <div class="episode-card glass flex gap-4 rounded-2xl p-4 hover:bg-white/5 transition">

            <img src="${ep.image}" class="h-24 w-40 rounded-xl object-cover"/>

            <div>
              <p class="text-sm text-red-400">Episode ${ep.ep}</p>
              <h3 class="mt-1 text-lg font-semibold">${ep.title}</h3>
              <p class="mt-2 text-sm text-slate-400">${ep.desc}</p>
            </div>

          </div>

        </a>
      `;
    });
  }

  window.showSeason = function(season) {
    if (season === 1) render(season1);
    if (season === 2) render(season2);
    if (season === "s3p1") render(s3p1);
    if (season === "s3p2") render(s3p2);
  };

  /* AUTO LOAD */
  showSeason(1);

});
</script>
</body>
</html>
